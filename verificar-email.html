<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ZKNbet — Verificar Email</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Sora:wght@800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/style.css">
  <link rel="stylesheet" href="assets/icons.css">

  <style>
    /* Evita scroll horizontal acidental no mobile */
    html, body {
      max-width: 100%;
      overflow-x: hidden;
    }

    /* Carrossel Responsivo */
    #carrosselBanners {
      width: 100% !important;
      max-width: 1000px !important;
      margin: 24px auto 0 !important;
      padding: 0 16px !important;
      box-sizing: border-box;
    }
    .carrossel-wrapper {
      max-width: 1280px;
      margin: 0 auto;
      position: relative;
      border-radius: 16px;
      overflow: hidden;
    }
    #carrosselTrack {
      display: flex !important;
      flex-wrap: nowrap !important;
      align-items: flex-start !important;
      touch-action: pan-y !important;
      user-select: none;
      -webkit-user-select: none;
      transition: transform 0.5s ease;
    }
    #carrosselTrack > div {
      flex: 0 0 100% !important;
      min-width: 100% !important;
      width: 100% !important;
      cursor: pointer;
    }
    #carrosselTrack img {
      width: 100% !important;
      height: auto !important;
      display: block !important;
      object-fit: contain !important;
    }

    /* Barra de busca responsiva */
    .search-box-wrapper {
      position: relative;
      margin-bottom: 20px;
      width: 100%;
      max-width: 420px;
    }
    .search-box-input {
      width: 100%;
      box-sizing: border-box;
      padding: 12px 16px 12px 44px;
      background: var(--bg-2);
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-sm);
      color: var(--text);
      font-size: 16px;
      outline: none;
    }

    /* Ajustes específicos para Mobile */
    @media (max-width: 768px) {
      #carrosselBanners {
        margin-top: 14px !important;
        padding: 0 12px !important;
      }
      .carrossel-wrapper {
        border-radius: 12px;
      }
      .winners-ticker {
        margin-top: 14px !important;
      }
      .search-box-wrapper {
        max-width: 100%;
        margin-bottom: 16px;
      }
      .section-header {
        gap: 8px;
      }
      .section-title {
        font-size: 18px;
      }
      .zkn-footer {
        padding-bottom: 84px;
      }
    }
  </style>
</head>
<body>
  <header class="zkn-header"><div class="zkn-header-inner"></div></header>

  <div class="auth-wrap">
    <div class="card auth-card" style="text-align:center;">
      <div id="icon" style="font-size:56px;margin-bottom:16px;">⏳</div>
      <h1 id="titulo" style="font-family:var(--font-display);">Verificando...</h1>
      <p class="subtitle" id="msg">Aguarde um instante.</p>
      <a href="index.html" class="btn-primary btn-block" style="text-decoration:none;display:inline-flex;justify-content:center;" id="btnVoltar">Ir para o início</a>
    </div>
  </div>

  <script src="assets/loading.js"></script>
  <script src="assets/config.js"></script>
  <script src="assets/validators.js"></script>
  <script src="assets/auth.js"></script>
  <script src="assets/app.js"></script>
  <script>
    (async function() {
      const token = new URLSearchParams(location.search).get("token");
      const icon = document.getElementById("icon");
      const titulo = document.getElementById("titulo");
      const msg = document.getElementById("msg");

      if (!token) {
        icon.textContent = "❌";
        titulo.textContent = "Link inválido";
        msg.textContent = "O link de verificação está incompleto.";
        return;
      }

      try {
        const apiBase = (window.ZKN_CONFIG && window.ZKN_CONFIG.api) || '';
        const res = await fetch(apiBase + '/auth/verify-email', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token }),
        });
        const data = await res.json().catch(() => ({}));

        if (res.ok) {
          icon.textContent = "✅";
          titulo.textContent = "Email verificado!";
          msg.textContent = "Sua conta está liberada para saques.";
          if (window.ZKNAuth && ZKNAuth.getUser && ZKNAuth.getUser()) {
            const u = ZKNAuth.getUser();
            u.emailVerified = true;
            ZKNAuth.setUser(u);
          }
        } else {
          icon.textContent = "⚠️";
          titulo.textContent = "Não foi possível verificar";
          msg.textContent = data.message || "O link pode ter expirado.";
        }
      } catch (e) {
        icon.textContent = "⚠️";
        titulo.textContent = "Erro";
        msg.textContent = e.message;
      }
    })();
  </script>
</body>
</html>
