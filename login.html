<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZKNbet — Entrar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Sora:wght@600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <header class="zkn-header"><div class="zkn-header-inner"></div></header>

  <div class="auth-wrap">
    <div class="card auth-card">
      <h1>Entrar</h1>
      <p class="subtitle">Acesse com seu celular e senha.</p>

      <label for="phone">Celular</label>
      <input type="tel" id="phone" placeholder="(11) 91234-5678" inputmode="numeric" autocomplete="tel">

      <label for="email">E-mail (ou use celular acima)</label>
      <input type="email" id="email" placeholder="seu@email.com" autocomplete="email">

      <label for="password">Senha</label>
      <input type="password" id="password" placeholder="Sua senha" autocomplete="current-password">

      <button id="btnEntrar" class="btn-primary btn-block">Entrar</button>

      <p class="auth-alt">Não tem conta? <a href="cadastro.html">Cadastre-se</a></p>
    </div>
  </div>

  <script src="assets/config.js"></script>
  <script src="assets/validators.js"></script>
  <script src="assets/auth.js"></script>
  <script src="assets/app.js"></script>
  <script>
    const phoneEl = document.getElementById('phone');
    phoneEl.addEventListener('input', () => window.ZKNVal.mascaraCelular(phoneEl));

    document.getElementById('btnEntrar').onclick = async () => {
      const email = document.getElementById('email').value.trim();
      const phone = window.ZKNVal.normalizarCelular(phoneEl.value);
      const password = document.getElementById('password').value;

      if (!email && !window.ZKNVal.validarCelular(phone)) return ZKN.toast('Informe celular ou e-mail', 'Preencha um dos dois.', 'error');
      if (!window.ZKNVal.validarCelular(phone)) return ZKN.toast('Celular inválido', 'Digite DDD + 9 + 8 dígitos.', 'error');
      if (!password || password.length < 6) return ZKN.toast('Senha muito curta', 'Mínimo de 6 caracteres.', 'error');

      const btn = document.getElementById('btnEntrar');
      btn.disabled = true;
      btn.textContent = 'Entrando...';

      const payload = email ? { email, password } : { phone, password };
      const r = await ZKNAuth.login(payload);

      btn.disabled = false;
      btn.textContent = 'Entrar';

      if (!r.sucesso) return ZKN.toast('Não foi possível entrar', r.mensagem, 'error');

      ZKN.toast('Bem-vindo!', 'Login realizado com sucesso.');
      const back = new URLSearchParams(location.search).get('back') || 'index.html';
      setTimeout(() => location.href = back, 600);
    };
  </script>
</body>
</html>
