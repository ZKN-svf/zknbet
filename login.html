<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZKNbet — Entrar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Sora:wght@800&display=swap" rel="stylesheet">
  <link rel="preconnect" href="https://zknbet-api.gabrielrobin63.workers.dev" crossorigin>
  <link rel="preconnect" href="https://nitrogames.pladarck.shop" crossorigin>
  <link rel="dns-prefetch" href="https://nitrogames.pladarck.shop">
  <link rel="stylesheet" href="assets/style.css">
  <link rel="stylesheet" href="assets/icons.css">
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
  <header class="zkn-header"><div class="zkn-header-inner"></div></header>

  <div class="auth-wrap">
    <div class="card auth-card">
      <h1>Entrar</h1>
      <p class="subtitle">Acesse com seu celular e senha.</p>

      <label for="phone">Celular</label>
      <input type="tel" id="phone" placeholder="(11) 91234-5678" inputmode="numeric" autocomplete="tel">

      <label for="email">E-mail (ou use celular acima)</label>
      <input type="email" id="email" placeholder="seu@email.com" autocomplete="email">

      <label for="password">Senha</label>
      <input type="password" id="password" placeholder="Sua senha" autocomplete="current-password">
      <div class="cf-turnstile" data-sitekey="0x4AAAAAAFuJgB2DNgZO7dLw" data-action="login" style="margin-bottom:16px;"></div>

      <div id="g_id_onload"
           data-client_id="643374147618-8cfpb3gkfbl2pi7n4obujbpfdo6haikt.apps.googleusercontent.com"
           data-callback="handleGoogleLogin"
           data-auto_prompt="false"></div>
      <div class="g_id_signin" data-type="standard" data-size="large" data-theme="outline"
           data-text="signin_with" data-shape="rectangular" data-logo_alignment="left"
           style="margin: 16px 0;"></div>
      <div style="display:flex;align-items:center;gap:12px;margin:16px 0;">
        <div style="flex:1;height:1px;background:var(--border);"></div>
        <span style="color:var(--text-muted);font-size:12px;">ou</span>
        <div style="flex:1;height:1px;background:var(--border);"></div>
      </div>
      <div style="text-align:right;margin-bottom:12px;"><a href="esqueci-senha.html" style="color:var(--text-muted);font-size:13px;text-decoration:none;">Esqueci minha senha</a></div>
      <button id="btnEntrar" class="btn-primary btn-block">Entrar</button>

      <p class="auth-alt">Não tem conta? <a href="cadastro.html">Cadastre-se</a></p>
    </div>
  </div>

  <script src="assets/loading.js"></script>
  <script src="assets/config.js"></script>
  <script src="assets/validators.js"></script>
  <script src="assets/auth.js"></script>
  <script src="assets/app.js"></script>
  <script src="assets/bottom-nav.js"></script>
  <script src="assets/game-frame.js"></script>
  <script>

    window.handleGoogleLogin = async function(response) {
      if (!response || !response.credential) {
        return ZKN.toast('Erro', 'Falha no Google.', 'error');
      }
      const back = new URLSearchParams(location.search).get('back') || 'index.html';
      ZKN.toast('Entrando...', 'Validando conta Google');
      const r = await ZKNAuth.loginGoogle({ credential: response.credential });
      if (!r.sucesso) return ZKN.toast('Erro', r.mensagem, 'error');
      ZKN.toast('Bem-vindo!', 'Login com Google realizado.');
      setTimeout(() => location.href = back, 600);
    };
    const phoneEl = document.getElementById('phone');
    phoneEl.addEventListener('input', () => window.ZKNVal.mascaraCelular(phoneEl));

    document.getElementById('btnEntrar').onclick = async () => {

    window.handleGoogleLogin = async function(response) {
      if (!response || !response.credential) {
        return ZKN.toast('Erro', 'Falha no Google.', 'error');
      }
      const back = new URLSearchParams(location.search).get('back') || 'index.html';
      ZKN.toast('Entrando...', 'Validando conta Google');
      const r = await ZKNAuth.loginGoogle({ credential: response.credential });
      if (!r.sucesso) return ZKN.toast('Erro', r.mensagem, 'error');
      ZKN.toast('Bem-vindo!', 'Login com Google realizado.');
      setTimeout(() => location.href = back, 600);
    };
      const phoneEl = document.getElementById('phone');
      const emailEl = document.getElementById('email');
      const passEl = document.getElementById('password');

      const phone = phoneEl ? window.ZKNVal.normalizarCelular(phoneEl.value) : '';
      const email = emailEl ? emailEl.value.trim() : '';
      const password = passEl ? passEl.value : '';

      // Validacao
      const phoneOk = phone && window.ZKNVal.validarCelular(phone);
      const emailOk = email && window.ZKNVal.validarEmail(email);

      if (!phoneOk && !emailOk) {
        return ZKN.toast('Informe celular ou e-mail', 'Preencha um dos dois corretamente.', 'error');
      }
      if (!password || password.length < 6) {
        return ZKN.toast('Senha muito curta', 'Minimo de 6 caracteres.', 'error');
      }

      const btn = document.getElementById('btnEntrar');
      btn.disabled = true;
      btn.textContent = 'Entrando...';

      // Fallback: tenta telefone primeiro; se falhar, tenta e-mail
      let payload = phoneOk ? { phone, password } : { email, password };

      // Debug: mostra o body que sera enviado
      const bodyStr = JSON.stringify(payload);
      console.log('[LOGIN] Body enviado:', bodyStr);
      console.log('[LOGIN] Body hex:', Array.from(bodyStr).map(c => c.charCodeAt(0).toString(16)).join(' '));

      const turnstileToken = document.querySelector('.cf-turnstile input[name="cf-turnstile-response"]')?.value || '';

      payload.turnstileToken = turnstileToken;

      const r = await ZKNAuth.login(payload);

      btn.disabled = false;
      btn.textContent = 'Entrar';

      if (!r.sucesso) {
        console.error('[LOGIN] Falha:', r.mensagem);
        return ZKN.toast('Nao foi possivel entrar', r.mensagem || 'Verifique os dados.', 'error');
      }

      console.log('[LOGIN] Sucesso:', r.user);
      ZKN.toast('Bem-vindo!', 'Login realizado com sucesso.');
      const back = new URLSearchParams(location.search).get('back') || 'index.html';
      setTimeout(() => location.href = back, 600);
    };
  </script>
<script>
  // Olhinho para mostrar/ocultar senha
  document.addEventListener('DOMContentLoaded', () => {
    document.querySelectorAll('input[type="password"]').forEach(input => {
      // Evita duplicar se já existir
      if (input.parentNode.classList.contains('zkn-pass-wrap')) return;

      // Cria o wrapper e move o input pra dentro
      const wrap = document.createElement('div');
      wrap.className = 'zkn-pass-wrap';
      input.parentNode.insertBefore(wrap, input);
      wrap.appendChild(input);

      // Cria o botão do olho
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'zkn-eye-toggle';
      btn.innerHTML = `
        <svg class="eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
          <line x1="1" y1="1" x2="23" y2="23"></line>
        </svg>
        <svg class="eye-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none;">
          <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
          <circle cx="12" cy="12" r="3"></circle>
        </svg>
      `;
      
      // Adiciona estilo direto no botão pra não depender do CSS
      btn.style.cssText = 'position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--text-muted);cursor:pointer;padding:4px;display:flex;align-items:center;justify-content:center;';
      
      wrap.appendChild(btn);

      btn.onclick = () => {
        const isHidden = input.type === 'password';
        input.type = isHidden ? 'text' : 'password';
        btn.querySelector('.eye-off').style.display = isHidden ? 'none' : 'block';
        btn.querySelector('.eye-on').style.display = isHidden ? 'block' : 'none';
      };

      // Ajusta o padding do input pra não ficar embaixo do olho
      input.style.paddingRight = '40px';
    });
  });
</script>
</body>
</html>
