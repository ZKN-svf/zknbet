<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ZKNbet — Jogo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Sora:wght@800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/style.css">
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #000;
      overflow: hidden;
      height: 100vh;
    }
    .game-frame-wrapper {
      position: fixed;
      inset: 0;
      background: #000;
    }
    .game-frame {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
    .game-back-btn {
      position: fixed;
      top: 12px;
      left: 12px;
      z-index: 9999;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: rgba(10, 15, 26, 0.9);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(245, 190, 60, 0.4);
      color: #f5be3c;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.5);
      transition: all 0.18s ease;
    }
    .game-back-btn:hover {
      background: rgba(245, 190, 60, 0.2);
      border-color: #f5be3c;
      transform: scale(1.05);
    }
    .game-back-btn svg {
      width: 22px;
      height: 22px;
    }
    .game-loading {
      position: fixed;
      inset: 0;
      background: linear-gradient(180deg, #0a0f1a 0%, #05070d 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      z-index: 100;
      transition: opacity 0.3s ease;
    }
    .game-loading.hidden {
      opacity: 0;
      pointer-events: none;
    }
    .game-loading-spinner {
      width: 60px;
      height: 60px;
      border: 4px solid rgba(245, 190, 60, 0.15);
      border-top-color: #f5be3c;
      border-radius: 50%;
      animation: gm-spin 0.9s linear infinite;
    }
    @keyframes gm-spin { to { transform: rotate(360deg); } }
    .game-loading-text {
      font-family: 'Sora', 'Inter', sans-serif;
      font-size: 20px;
      font-weight: 800;
      color: #f5be3c;
      text-align: center;
      padding: 0 20px;
    }
    .game-loading-sub {
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      color: #8a94a6;
      font-weight: 600;
      text-align: center;
      min-height: 20px;
    }
    @media (max-width: 768px) {
      .game-back-btn {
        width: 40px;
        height: 40px;
        top: 8px;
        left: 8px;
      }
    }
  </style>
</head>
<body>
  <!-- Botão voltar -->
  <button class="game-back-btn" onclick="voltar()" title="Voltar ao lobby">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <line x1="19" y1="12" x2="5" y2="12"/>
      <polyline points="12 19 5 12 12 5"/>
    </svg>
  </button>

  <!-- Loading -->
  <div class="game-loading" id="loading">
    <div class="game-loading-spinner"></div>
    <div class="game-loading-text">Carregando jogo...</div>
    <div class="game-loading-sub" id="loadingSub"></div>
  </div>

  <!-- Iframe do jogo -->
  <div class="game-frame-wrapper">
    <iframe id="gameFrame" class="game-frame" allow="autoplay; fullscreen; payment; same-origin; storage-access" sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-popups-to-escape-sandbox allow-modals allow-storage-access-by-user-activation"></iframe>
  </div>

  <script>
    // Pega URL do jogo
    const params = new URLSearchParams(location.search);
    const gameUrl = params.get('url');
    const gameName = params.get('name') || 'Jogo';

    if (!gameUrl) {
      document.getElementById('loading').innerHTML = '<div style="color:#ff4757;text-align:center;padding:40px;font-family:Inter,sans-serif;">Jogo não encontrado</div>';
    } else {
      const frame = document.getElementById('gameFrame');
      const loading = document.getElementById('loading');
      const loadingSub = document.getElementById('loadingSub');
      
      let carregou = false;

      // Timer de 5s
      setTimeout(() => {
        if (!carregou) {
          loadingSub.textContent = 'Conexão fraca... aguarde';
          loadingSub.style.color = '#f5be3c';
        }
      }, 5000);

      // Timer de 15s
      setTimeout(() => {
        if (!carregou) {
          loadingSub.textContent = 'O jogo está demorando muito.';
          loadingSub.style.color = '#ff4757';
        }
      }, 15000);

      frame.addEventListener('load', () => {
        carregou = true;
        setTimeout(() => loading.classList.add('hidden'), 500);
      });

      frame.src = decodeURIComponent(gameUrl);
    }

    function voltar() {
      // Atualiza saldo antes de voltar
      if (window.opener && window.opener.ZKNAuth) {
        window.opener.ZKNAuth.getSaldo().catch(() => {});
      }
      // Volta pra index ou jogos
      if (history.length > 1) {
        history.back();
      } else {
        location.href = 'index.html';
      }
    }

    // Fecha com ESC
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') voltar();
    });
  </script>
</body>
</html>
