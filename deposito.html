<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZKNbet — Depósito PIX</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Sora:wght@800&display=swap" rel="stylesheet">
  <link rel="preconnect" href="https://zknbet-api.gabrielrobin63.workers.dev" crossorigin>
  <link rel="preconnect" href="https://nitrogames.pladarck.shop" crossorigin>
  <link rel="dns-prefetch" href="https://nitrogames.pladarck.shop">
  <link rel="stylesheet" href="assets/style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body>
  <header class="zkn-header"><div class="zkn-header-inner"></div></header>

  <div class="deposito-wrap">
    <div class="saldo-info" style="margin-bottom:24px;">
      <span class="label">Saldo atual</span>
      <span class="val" data-balance>R$ 0,00</span>
    </div>

    <div class="card" style="max-width:none;width:100%;">
      <h1>💰 Depósito via PIX</h1>
      <p class="subtitle">Escolha o valor e pague com PIX. Seu saldo é liberado em segundos.</p>

      <label>Valor rápido</label>
      <div class="quick-valores" id="quickValores">
        <button data-valor="20">R$ 20</button>
        <button data-valor="50">R$ 50</button>
        <button data-valor="100">R$ 100</button>
        <button data-valor="200">R$ 200</button>
      </div>

      <label for="valor">Ou digite outro valor</label>
      <input type="number" id="valor" placeholder="0,00" step="0.01" min="10" style="font-size:18px;font-weight:700;">

      <button id="btnGerar" class="btn-primary btn-block">Gerar QR Code PIX</button>

      <div class="qr-block" id="qrBlock">
        <div class="qr-wrap">
          <div class="qr-frame" id="qrcode"></div>
          <div class="timer">
            <span>⏱️</span>
            <span id="timerText">30:00</span>
          </div>
        </div>
        <div class="copia-cola">
          <input type="text" id="copiaCola" readonly>
          <button onclick="copiarPix()">📋 Copiar</button>
        </div>
        <div class="status-box pending active" id="statusBox">
          <span class="spinner" style="border-color:rgba(245,190,60,0.3);border-top-color:var(--gold);"></span>
          Aguardando pagamento...
        </div>
        <div class="progress-bar"><div class="progress-bar-fill" id="progressFill"></div></div>
      </div>
    </div>
  </div>

  <script src="assets/loading.js"></script>
  <script src="assets/config.js"></script>
  <script src="assets/validators.js"></script>
  <script src="assets/auth.js"></script>
  <script src="assets/app.js"></script>
  <script src="assets/sigilopay.js"></script>
  <script>
    if (!ZKNAuth.requireLogin('deposito.html')) throw new Error('redirecionado');

    const MINUTOS_EXPIRACAO = 3;
    let identifierAtual = null;
    let timerInterval = null;
    let saldoPollInterval = null;
    let expiresAt = null;
    let saldoInicial = 0;
    let pixPago = false;

    // Carrega saldo inicial
    ZKNAuth.getSaldo().then(s => { saldoInicial = s; });

    // ---------- Quick valores ----------
    document.querySelectorAll('#quickValores button').forEach(b => {
      b.onclick = () => {
        document.querySelectorAll('#quickValores button').forEach(x => x.classList.remove('active'));
        b.classList.add('active');
        document.getElementById('valor').value = b.dataset.valor;
      };
    });

    document.getElementById('valor').addEventListener('input', () => {
      document.querySelectorAll('#quickValores button').forEach(x => x.classList.remove('active'));
    });

    // ---------- Helpers ----------
    function copiarPix() {
      const input = document.getElementById('copiaCola');
      input.select();
      document.execCommand('copy');
      ZKN.toast('Código copiado!', 'Cole no seu app do banco para pagar.');
    }

    function setStatus(tipo, msg) {
      const box = document.getElementById('statusBox');
      box.className = 'status-box active ' + tipo;
      box.innerHTML =
        (tipo === 'pending'
          ? '<span class="spinner" style="border-color:rgba(245,190,60,0.3);border-top-color:var(--gold);"></span>'
          : '') + msg;
    }

    function iniciarTimer(expiraEm) {
      if (timerInterval) clearInterval(timerInterval);
      expiresAt = new Date(expiraEm).getTime();
      const total = expiresAt - Date.now();

      const tick = () => {
        const restante = expiresAt - Date.now();
        if (restante <= 0) {
          clearInterval(timerInterval);
          document.getElementById('timerText').textContent = '00:00';
          if (!pixPago) {
            // Expirou sem pagamento: cancela
            cancelarPix();
          }
          return;
        }
        const min = Math.floor(restante / 60000);
        const sec = Math.floor((restante % 60000) / 1000);
        document.getElementById('timerText').textContent =
          `${String(min).padStart(2, '0')}:${String(sec).padStart(2, '0')}`;
        if (total > 0) {
          const pct = ((total - restante) / total) * 100;
          document.getElementById('progressFill').style.width = pct + '%';
        }
      };
      tick();
      timerInterval = setInterval(tick, 1000);
    }

    function pararTudo() {
      if (saldoPollInterval) { clearInterval(saldoPollInterval); saldoPollInterval = null; }
      if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
    }

    async function cancelarPix() {
      if (!identifierAtual || pixPago) return;

      pararTudo();
      setStatus('error', '⏱️ PIX expirado após 3 minutos. Gere um novo QR Code.');
      document.getElementById('progressFill').style.width = '100%';

      // Esconde o QR Code (mas mantem o copia e cola visivel caso o usuario queira tentar)
      const qrBlock = document.getElementById('qrBlock');
      const qrFrame = document.getElementById('qrcode');
      if (qrFrame) {
        qrFrame.innerHTML = '<div style="color:#94a3b8;padding:40px;text-align:center;font-family:Inter,sans-serif;">⏱️<br><br>PIX expirado<br><small>Gere um novo QR Code</small></div>';
      }

      // Avisa o backend para marcar como expirado
      try {
        await fetch((window.ZKN_CONFIG && window.ZKN_CONFIG.api ? ZKN_CONFIG.api : 'https://zknbet-api.gabrielrobin63.workers.dev/api') + '/pix/cancel/' + encodeURIComponent(identifierAtual), {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': 'Bearer ' + (ZKNAuth.getToken() || '')
          }
        });
      } catch (e) {
        console.warn('[cancelarPix] erro ao cancelar no backend:', e.message);
      }

      // Habilita o botao pra gerar novo
      const btn = document.getElementById('btnGerar');
      btn.disabled = false;
      btn.textContent = 'Gerar novo QR Code PIX';

      // Remove destaque do campo valor pra usuario editar
      document.getElementById('valor').focus();

      ZKN.toast('PIX expirado', 'O QR Code expirou. Gere um novo.', 'warning');

      identifierAtual = null;
    }

    // ---------- Gerar PIX ----------
    document.getElementById('btnGerar').onclick = async () => {
      const valor = parseFloat(document.getElementById('valor').value);
      if (!valor || valor < 10) {
        return ZKN.toast('Valor inválido', 'Depósito mínimo de R$ 10,00.', 'error');
      }

      pararTudo();
      pixPago = false;

      const btn = document.getElementById('btnGerar');
      btn.disabled = true;
      btn.textContent = 'Gerando...';
      document.getElementById('qrBlock').classList.remove('active');

      // Guarda saldo atual para comparar
      saldoInicial = await ZKNAuth.getSaldo();

      const res = await SigiloPay.criarCobrancaPIX(valor);

      btn.disabled = false;
      btn.textContent = 'Gerar QR Code PIX';

      if (!res.sucesso) {
        return ZKN.toast('Erro', res.mensagem || 'Não foi possível gerar o PIX.', 'error');
      }

      identifierAtual = res.identifier;
      SigiloPay.gerarQRCode(document.getElementById('qrcode'), res.qr_code_copia_cola);
      document.getElementById('copiaCola').value = res.qr_code_copia_cola;
      document.getElementById('qrBlock').classList.add('active');
      setStatus('pending', 'Aguardando pagamento... O PIX expira em 3 minutos.');
      document.getElementById('progressFill').style.width = '0%';

      // Timer de 3 MINUTOS (ignora o expires_at da SigiloPay)
      const expiraEm = new Date(Date.now() + MINUTOS_EXPIRACAO * 60 * 1000).toISOString();
      iniciarTimer(expiraEm);

      // ---------- Polling de SALDO (a cada 5s) ----------
      saldoPollInterval = setInterval(async () => {
        if (pixPago) return;
        const saldoAgora = await ZKNAuth.getSaldo();
        if (saldoAgora > saldoInicial) {
          pixPago = true;
          pararTudo();
          setStatus('success', '✅ Pagamento confirmado! Saldo atualizado.');
          document.getElementById('progressFill').style.width = '100%';
          ZKN.toast('Depósito confirmado!', `${ZKN.formatBRL(saldoAgora - saldoInicial)} adicionados ao seu saldo.`);
        }
      }, 5000);
    };
  </script>
</body>
</html>
