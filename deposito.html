<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https:; style-src 'self' 'unsafe-inline' https:; img-src 'self' data: blob: https:; font-src 'self' data: https:; connect-src 'self' https: wss:; frame-src 'self' https:; media-src 'self' data: blob: https:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self' https:">
  <title>ZKNbet — Depósito PIX</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Sora:wght@800&display=swap" rel="stylesheet">
  <link rel="preconnect" href="https://zknbet-api.gabrielrobin63.workers.dev" crossorigin>
  <link rel="stylesheet" href="assets/style.css">
  <link rel="stylesheet" href="assets/icons.css">
  <link rel="stylesheet" href="assets/events.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body>
  <header class="zkn-header"><div class="zkn-header-inner"></div></header>

  <div class="deposito-wrap">
    <div class="saldo-info" style="margin-bottom:24px;">
      <span class="label">Saldo atual</span>
      <span class="val" data-balance>R$ 0,00</span>
    </div>

    <div class="card" style="max-width:none;width:100%;">
      <h1><span class="ico ico-money"></span> Depósito via PIX</h1>
      <p class="subtitle">Escolha o valor e pague com PIX. Seu saldo é liberado em segundos.</p>

      <label>Valor rápido</label>
      <div class="quick-valores" id="quickValores">
        <button data-valor="20">R$ 20</button>
        <button data-valor="50">R$ 50</button>
        <button data-valor="100">R$ 100</button>
        <button data-valor="200">R$ 200</button>
        <button data-valor="350">R$ 350</button>
      </div>

      <label for="valor">Ou digite outro valor</label>
      <input type="number" id="valor" placeholder="0,00" step="0.01" min="10" style="font-size:18px;font-weight:700;">

      <div id="bonusPreview" class="deposito-bonus-preview"></div>

      <button id="btnGerar" class="btn-primary btn-block">Gerar QR Code PIX</button>

      <div class="qr-block" id="qrBlock">
        <div class="qr-wrap">
          <div class="qr-frame" id="qrcode"></div>
          <div class="timer">
            <span class="ico ico-clock"></span>
            <span id="timerText">03:00</span>
          </div>
        </div>
        <div class="copia-cola">
          <input type="text" id="copiaCola" readonly>
          <button onclick="copiarPix()"><span class="ico ico-check"></span> Copiar</button>
        </div>
        <div class="status-box pending active" id="statusBox">
          <span class="spinner" style="border-color:rgba(245,190,60,0.3);border-top-color:var(--gold);"></span>
          Aguardando pagamento...
        </div>
        <div class="progress-bar"><div class="progress-bar-fill" id="progressFill"></div></div>
        <button id="btnVerificarPago" type="button" class="btn-secondary btn-block" style="margin-top:12px;">Já paguei — verificar agora</button>
      </div>
    </div>
  </div>

  <script src="assets/loading.js"></script>
  <script src="assets/config.js"></script>
  <script src="assets/validators.js"></script>
  <script src="assets/auth.js"></script>
  <script src="assets/app.js"></script>
  <script src="assets/bottom-nav.js"></script>
  <script src="assets/game-frame.js"></script>
  <script src="assets/sigilopay.js"></script>
  <script>
    if (!ZKNAuth.requireLogin('deposito.html')) throw new Error('redirecionado');

    const MINUTOS_EXPIRACAO = 3;
    let identifierAtual = null;
    let timerInterval = null;
    let saldoPollInterval = null;
    let expiresAt = null;
    let saldoInicial = 0;
    let pixPago = false;
    let bonusTiers = [];
    let bonusConfig = null;

    ZKNAuth.getSaldo().then(s => { saldoInicial = s; });

    function atualizarPreviewBonus() {
      const box = document.getElementById('bonusPreview');
      if (!box) return;
      const v = parseFloat(document.getElementById('valor').value);
      if (!v || !bonusTiers.length) {
        box.classList.remove('visible');
        return;
      }
      const match = [...bonusTiers]
        .filter(t => Number(t.deposit_amount) <= v)
        .sort((a, b) => Number(b.deposit_amount) - Number(a.deposit_amount))[0];
      if (!match) {
        const menor = [...bonusTiers].sort((a, b) => Number(a.deposit_amount) - Number(b.deposit_amount))[0];
        if (menor) {
          box.innerHTML = '<span class="ico ico-gift"></span> Deposite a partir de <strong>' + ZKN.formatBRL(menor.deposit_amount) + '</strong> para ganhar <strong>+' + ZKN.formatBRL(menor.bonus_amount) + '</strong> de bônus!';
          box.classList.add('visible');
        } else {
          box.classList.remove('visible');
        }
        return;
      }
      const rule = bonusConfig && Number(bonusConfig.first_deposit_only) === 1 ? ' (1º depósito)' : '';
      box.innerHTML = '<span class="ico ico-gift"></span> Este valor libera <strong>+' + ZKN.formatBRL(match.bonus_amount) + '</strong> de bônus' + rule + ' em <a href="recompensas.html" style="color:var(--gold);text-decoration:underline;">Recompensas</a>!';
      box.classList.add('visible');
    }

    ZKNAuth.api('/deposit-bonus/list', { auth: false }).then(r => {
      if (r.ok && r.data && Array.isArray(r.data.tiers)) {
        bonusTiers = r.data.tiers;
        bonusConfig = r.data.config || null;
        atualizarPreviewBonus();
      }
    }).catch(() => {});

    document.querySelectorAll('#quickValores button').forEach(b => {
      b.onclick = () => {
        document.querySelectorAll('#quickValores button').forEach(x => x.classList.remove('active'));
        b.classList.add('active');
        document.getElementById('valor').value = b.dataset.valor;
        atualizarPreviewBonus();
      };
    });

    document.getElementById('valor').addEventListener('input', () => {
      document.querySelectorAll('#quickValores button').forEach(x => x.classList.remove('active'));
      atualizarPreviewBonus();
    });

    (function () {
      const vParam = parseFloat(new URLSearchParams(location.search).get('valor'));
      if (vParam && vParam >= 10) {
        document.getElementById('valor').value = vParam;
        document.querySelectorAll('#quickValores button').forEach(b => {
          if (parseFloat(b.dataset.valor) === vParam) b.classList.add('active');
        });
      }
    })();

    function copiarPix() {
      const input = document.getElementById('copiaCola');
      ZKN.copiarTexto(input.value, 'Código PIX copiado!', 'Cole no app do seu banco para pagar.');
    }

    function setStatus(tipo, msg) {
      const box = document.getElementById('statusBox');
      box.className = 'status-box active ' + tipo;
      box.innerHTML =
        (tipo === 'pending'
          ? '<span class="spinner" style="border-color:rgba(245,190,60,0.3);border-top-color:var(--gold);"></span>'
          : '') + msg;
    }

    function iniciarTimer(expiraEm) {
      if (timerInterval) clearInterval(timerInterval);
      expiresAt = new Date(expiraEm).getTime();
      const total = expiresAt - Date.now();

      const tick = () => {
        const restante = expiresAt - Date.now();
        if (restante <= 0) {
          clearInterval(timerInterval);
          document.getElementById('timerText').textContent = '00:00';
          if (!pixPago) cancelarPix();
          return;
        }
        const min = Math.floor(restante / 60000);
        const sec = Math.floor((restante % 60000) / 1000);
        document.getElementById('timerText').textContent =
          `${String(min).padStart(2, '0')}:${String(sec).padStart(2, '0')}`;
        if (total > 0) {
          const pct = ((total - restante) / total) * 100;
          document.getElementById('progressFill').style.width = pct + '%';
        }
      };
      tick();
      timerInterval = setInterval(tick, 1000);
    }

    function pararTudo() {
      if (saldoPollInterval) { clearInterval(saldoPollInterval); saldoPollInterval = null; }
      if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
    }

    function confirmarPagamentoUI(saldoAgora) {
      pixPago = true;
      pararTudo();
      setStatus('success', '<span class="ico ico-check"></span> Pagamento confirmado! Saldo atualizado.');
      document.getElementById('progressFill').style.width = '100%';
      const diff = saldoAgora > saldoInicial ? saldoAgora - saldoInicial : parseFloat(document.getElementById('valor').value || '0');
      ZKN.toast('Depósito confirmado!', `${ZKN.formatBRL(diff)} adicionados ao seu saldo.`);
      if (window.ZKN?.invalidarResumo) window.ZKN.invalidarResumo();
      if (window.ZKNBottomNav?.atualizarBadges) window.ZKNBottomNav.atualizarBadges();
    }

    async function verificarAgora(manual = false) {
      if (pixPago || !identifierAtual) return false;
      const btn = document.getElementById('btnVerificarPago');
      if (manual && btn) {
        btn.disabled = true;
        btn.textContent = 'Consultando PIX...';
      }
      try {
        const st = await SigiloPay.consultarPagamento(identifierAtual);
        const saldoAgora = await ZKNAuth.getSaldo();
        if ((st && st.pago) || saldoAgora > saldoInicial) {
          confirmarPagamentoUI(saldoAgora);
          return true;
        }
        if (manual) {
          ZKN.toast('Ainda pendente', 'O banco ainda está processando o PIX. Tentaremos novamente em instantes.', 'warning');
        }
      } catch {} finally {
        if (manual && btn && !pixPago) {
          btn.disabled = false;
          btn.textContent = 'Já paguei — verificar agora';
        }
      }
      return false;
    }

    document.getElementById('btnVerificarPago').onclick = () => verificarAgora(true);

    async function cancelarPix() {
      if (!identifierAtual || pixPago) return;

      pararTudo();
      setStatus('error', '<span class="ico ico-clock"></span> PIX expirado após 3 minutos. Gere um novo QR Code.');
      document.getElementById('progressFill').style.width = '100%';

      const qrFrame = document.getElementById('qrcode');
      if (qrFrame) {
        qrFrame.innerHTML = '<div style="color:#94a3b8;padding:40px;text-align:center;font-family:Inter,sans-serif;"><span class="ico ico-clock"></span><br><br>PIX expirado<br><small>Gere um novo QR Code</small></div>';
      }

      try {
        await ZKNAuth.api('/pix/cancel/' + encodeURIComponent(identifierAtual), { method: 'POST' });
      } catch (e) {
        console.warn('[cancelarPix]', e.message);
      }

      const btn = document.getElementById('btnGerar');
      btn.disabled = false;
      btn.textContent = 'Gerar novo QR Code PIX';
      document.getElementById('valor').focus();
      ZKN.toast('PIX expirado', 'O QR Code expirou. Gere um novo.', 'warning');
      identifierAtual = null;
    }

    document.getElementById('btnGerar').onclick = async () => {
      const valor = parseFloat(document.getElementById('valor').value);
      if (!valor || valor < 10) {
        return ZKN.toast('Valor inválido', 'Depósito mínimo de R$ 10,00.', 'error');
      }

      pararTudo();
      pixPago = false;

      const btn = document.getElementById('btnGerar');
      btn.disabled = true;
      btn.textContent = 'Gerando...';
      document.getElementById('qrBlock').classList.remove('active');

      saldoInicial = await ZKNAuth.getSaldo();

      const res = await SigiloPay.criarCobrancaPIX(valor);

      btn.disabled = false;
      btn.textContent = 'Gerar QR Code PIX';

      if (!res.sucesso) {
        return ZKN.toast('Erro', res.mensagem || 'Não foi possível gerar o PIX.', 'error');
      }

      identifierAtual = res.identifier;
      SigiloPay.gerarQRCode(document.getElementById('qrcode'), res.qr_code_copia_cola);
      document.getElementById('copiaCola').value = res.qr_code_copia_cola;
      document.getElementById('qrBlock').classList.add('active');
      const btnVerif = document.getElementById('btnVerificarPago');
      if (btnVerif) { btnVerif.disabled = false; btnVerif.textContent = 'Já paguei — verificar agora'; }
      setStatus('pending', 'Aguardando pagamento... O PIX expira em 3 minutos.');
      document.getElementById('progressFill').style.width = '0%';

      const expiraEm = new Date(Date.now() + MINUTOS_EXPIRACAO * 60 * 1000).toISOString();
      iniciarTimer(expiraEm);

      saldoPollInterval = setInterval(() => { verificarAgora(false); }, 6000);
    };
  </script>
</body>
</html>
