<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZKNbet — Recompensas</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Sora:wght@800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/style.css">
  <link rel="stylesheet" href="assets/icons.css">
  <style>
    .roulette-wrap { max-width: 500px; margin: 0 auto; padding: 24px; }
    .roulette-wheel {
      width: 280px; height: 280px; margin: 0 auto 24px;
      border-radius: 50%;
      background: conic-gradient(
        #f5be3c 0deg 60deg,
        #ffd76e 60deg 120deg,
        #00d67f 120deg 180deg,
        #00b96d 180deg 240deg,
        #3b82f6 240deg 300deg,
        #8b5cf6 300deg 360deg
      );
      display: flex; align-items: center; justify-content: center;
      position: relative;
      box-shadow: 0 8px 40px rgba(245,190,60,0.4);
      transition: transform 4s cubic-bezier(0.17, 0.67, 0.12, 0.99);
    }
    .roulette-wheel::after {
      content: '🎰'; font-size: 48px;
      width: 120px; height: 120px;
      background: #0a0f1a; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      border: 4px solid #f5be3c;
    }
    .roulette-pointer {
      position: absolute; top: -10px; left: 50%; transform: translateX(-50%);
      width: 0; height: 0;
      border-left: 14px solid transparent;
      border-right: 14px solid transparent;
      border-top: 24px solid #ff4757;
      z-index: 2;
      filter: drop-shadow(0 2px 8px rgba(255,71,87,0.8));
    }
    .roulette-result {
      text-align: center; font-size: 28px; font-weight: 900;
      color: #00d67f; margin-top: 24px; min-height: 40px;
    }
    .roulette-spin-btn {
      width: 100%; padding: 18px; font-size: 18px; font-weight: 900;
      background: linear-gradient(135deg, #f5be3c, #ffd76e);
      color: #0a0f1a; border: none; border-radius: 14px;
      cursor: pointer; margin-top: 24px;
    }
    .roulette-spin-btn:disabled {
      opacity: 0.5; cursor: not-allowed;
    }
  </style>
</head>
<body>
  <header class="zkn-header"><div class="zkn-header-inner"></div></header>

  <div class="roulette-wrap">
    <h1 style="font-family:var(--font-display);font-size:28px;text-align:center;margin-bottom:8px;">🎁 Recompensas</h1>
    <p style="text-align:center;color:var(--text-muted);margin-bottom:32px;">1 giro grátis por dia. Prêmios de R$ 1 a R$ 10!</p>

    <div style="position:relative;">
      <div class="roulette-pointer"></div>
      <div class="roulette-wheel" id="wheel"></div>
    </div>

    <div class="roulette-result" id="result"></div>

    <button class="roulette-spin-btn" id="spinBtn" onclick="girar()">🎰 Girar</button>

    <p style="text-align:center;color:var(--text-muted);font-size:12px;margin-top:16px;">
      Rollover de 3x sobre o valor ganho.
    </p>
  </div>

  <script src="assets/loading.js"></script>
  <script src="assets/config.js"></script>
  <script src="assets/validators.js"></script>
  <script src="assets/auth.js"></script>
  <script src="assets/app.js"></script>
  <script>
    if (!ZKNAuth.requireLogin('recompensas.html')) throw new Error('redirecionado');

    let girando = false;

    async function checkStatus() {
      try {
        const r = await ZKNAuth.api('/roulette/status');
        if (r.ok && r.data.available === false) {
          document.getElementById('spinBtn').disabled = true;
          document.getElementById('spinBtn').textContent = '⏰ Volte amanhã';
          document.getElementById('result').textContent = r.data.last_amount ? 'Você ganhou R$ ' + r.data.last_amount.toFixed(2).replace('.', ',') + ' hoje' : '';
        }
      } catch (e) {
        console.warn(e);
      }
    }

    async function girar() {
      if (girando) return;
      girando = true;

      const btn = document.getElementById('spinBtn');
      const wheel = document.getElementById('wheel');
      const result = document.getElementById('result');

      btn.disabled = true;
      btn.textContent = '🎰 Girando...';
      result.textContent = '';

      try {
        const r = await ZKNAuth.api('/roulette/spin', { method: 'POST' });
        if (!r.ok || !r.data.ok) {
          result.textContent = r.data.message || 'Erro';
          result.style.color = '#ff4757';
          btn.textContent = '🎰 Girar';
          btn.disabled = false;
          girando = false;
          return;
        }

        const valor = r.data.amount;
        const voltas = 5;
        const anguloFinal = (valor / 10) * 360 + voltas * 360;
        wheel.style.transform = 'rotate(' + anguloFinal + 'deg)';

        setTimeout(() => {
          result.textContent = '🎉 Você ganhou R$ ' + valor.toFixed(2).replace('.', ',') + '!';
          result.style.color = '#00d67f';
          btn.textContent = '⏰ Volte amanhã';
          if (window.ZKNSaldo) window.ZKNSaldo.atualizar();
          girando = false;
        }, 4200);
      } catch (e) {
        result.textContent = 'Erro de conexão';
        result.style.color = '#ff4757';
        btn.disabled = false;
        btn.textContent = '🎰 Girar';
        girando = false;
      }
    }

    checkStatus();
  </script>
</body>
</html>
