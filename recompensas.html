<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZKNbet — Recompensas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Sora:wght@800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/style.css">
  <link rel="stylesheet" href="assets/icons.css">
  <style>
    /* ============================================================ */
    /* RECOMPENSAS - Roleta visual                                  */
    /* ============================================================ */
    .rewards-hero {
      max-width: 560px;
      margin: 0 auto;
      padding: 32px 24px;
      text-align: center;
    }

    .rewards-title {
      font-family: var(--font-display);
      font-size: 32px;
      font-weight: 900;
      letter-spacing: -0.5px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-bottom: 8px;
    }

    .rewards-title svg {
      width: 32px;
      height: 32px;
      color: var(--gold);
    }

    .rewards-subtitle {
      color: var(--text-muted);
      font-size: 15px;
      margin-bottom: 32px;
      line-height: 1.5;
    }

    /* Container da roleta */
    .wheel-container {
      position: relative;
      width: 320px;
      height: 320px;
      margin: 0 auto 32px;
    }

    /* Ponteiro dourado no topo */
    .wheel-pointer {
      position: absolute;
      top: -18px;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 0;
      border-left: 16px solid transparent;
      border-right: 16px solid transparent;
      border-top: 28px solid var(--gold);
      z-index: 10;
      filter: drop-shadow(0 4px 12px rgba(245, 190, 60, 0.8));
      transition: transform 0.2s ease;
    }

    /* Roda */
    .wheel {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      position: relative;
      background: conic-gradient(
        from 0deg,
        #1a2332 0deg 60deg,
        #f5be3c 60deg 120deg,
        #1a2332 120deg 180deg,
        #00d67f 180deg 240deg,
        #1a2332 240deg 300deg,
        #ff4757 300deg 360deg
      );
      box-shadow:
        0 0 0 8px #0a0f1a,
        0 0 0 10px var(--gold),
        0 12px 48px rgba(0, 0, 0, 0.6),
        inset 0 0 40px rgba(0, 0, 0, 0.4);
      transition: transform 4.5s cubic-bezier(0.17, 0.67, 0.12, 0.99);
    }

    /* Valores nos setores */
    .wheel-segment {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 50%;
      height: 2px;
      transform-origin: left center;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      padding-right: 20px;
      font-family: var(--font-display);
      font-size: 18px;
      font-weight: 900;
      color: #fff;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.8);
      pointer-events: none;
    }

    .wheel-segment:nth-child(1) { transform: rotate(30deg); }
    .wheel-segment:nth-child(2) { transform: rotate(90deg); }
    .wheel-segment:nth-child(3) { transform: rotate(150deg); }
    .wheel-segment:nth-child(4) { transform: rotate(210deg); }
    .wheel-segment:nth-child(5) { transform: rotate(270deg); }
    .wheel-segment:nth-child(6) { transform: rotate(330deg); }

    .wheel-segment.gold { color: #0a0f1a; text-shadow: none; }
    .wheel-segment.green { color: #fff; }
    .wheel-segment.red { color: #fff; }

    /* Centro da roda */
    .wheel-center {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 90px;
      height: 90px;
      border-radius: 50%;
      background: linear-gradient(135deg, #1a2332 0%, #0a0f1a 100%);
      border: 4px solid var(--gold);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 24px rgba(245, 190, 60, 0.4);
      z-index: 5;
    }

    .wheel-center svg {
      width: 40px;
      height: 40px;
      color: var(--gold);
    }

    /* Resultado */
    .wheel-result {
      font-family: var(--font-display);
      font-size: 28px;
      font-weight: 900;
      color: var(--green);
      min-height: 40px;
      margin-bottom: 24px;
      letter-spacing: -0.5px;
      transition: all 0.3s ease;
    }

    .wheel-result.win {
      animation: win-pulse 0.6s ease-out;
    }

    @keyframes win-pulse {
      0% { transform: scale(0.8); opacity: 0; }
      50% { transform: scale(1.1); }
      100% { transform: scale(1); opacity: 1; }
    }

    /* Botão girar */
    .wheel-btn {
      width: 100%;
      max-width: 320px;
      padding: 18px 32px;
      font-family: var(--font-display);
      font-size: 18px;
      font-weight: 900;
      letter-spacing: 0.5px;
      background: linear-gradient(135deg, #f5be3c 0%, #ffd76e 100%);
      color: #0a0f1a;
      border: none;
      border-radius: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: all 0.2s ease;
      box-shadow: 0 4px 20px rgba(245, 190, 60, 0.4);
    }

    .wheel-btn svg {
      width: 22px;
      height: 22px;
    }

    .wheel-btn:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 8px 32px rgba(245, 190, 60, 0.6);
    }

    .wheel-btn:active:not(:disabled) {
      transform: translateY(0);
    }

    .wheel-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      box-shadow: none;
    }

    /* Info do rollover */
    .wheel-info {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 20px;
      color: var(--text-muted);
      font-size: 13px;
    }

    .wheel-info svg {
      width: 16px;
      height: 16px;
      color: var(--gold);
    }

    /* Mobile */
    @media (max-width: 480px) {
      .wheel-container {
        width: 280px;
        height: 280px;
      }
      .wheel-segment {
        font-size: 16px;
        padding-right: 16px;
      }
      .wheel-center {
        width: 76px;
        height: 76px;
      }
      .wheel-center svg {
        width: 32px;
        height: 32px;
      }
      .rewards-title {
        font-size: 26px;
      }
      .wheel-result {
        font-size: 24px;
      }
    }
  
    /* ============================================================ */
    /* REBATE - secao separada                                      */
    /* ============================================================ */
    .rebate-section {
      max-width: 560px;
      margin: 48px auto 0;
      padding: 0 24px 48px;
    }

    .rebate-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 8px;
    }

    .rebate-header svg {
      width: 28px;
      height: 28px;
      color: var(--green);
    }

    .rebate-title {
      font-family: var(--font-display);
      font-size: 24px;
      font-weight: 900;
      letter-spacing: -0.3px;
    }

    .rebate-subtitle {
      color: var(--text-muted);
      font-size: 14px;
      margin-bottom: 24px;
    }

    .rebate-card {
      background: linear-gradient(135deg, #111827 0%, #0a0f1a 100%);
      border: 1px solid var(--border-gold);
      border-radius: 20px;
      padding: 24px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
    }

    .rebate-stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-bottom: 20px;
    }

    .rebate-stat {
      background: rgba(0, 214, 127, 0.08);
      border: 1px solid rgba(0, 214, 127, 0.2);
      border-radius: 12px;
      padding: 16px;
      text-align: center;
    }

    .rebate-stat-label {
      font-size: 11px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.6px;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .rebate-stat-value {
      font-family: var(--font-display);
      font-size: 24px;
      font-weight: 900;
      color: var(--green);
      letter-spacing: -0.5px;
    }

    .rebate-stat-value.gold {
      color: var(--gold);
    }

    .rebate-btn {
      width: 100%;
      padding: 16px;
      font-family: var(--font-display);
      font-size: 16px;
      font-weight: 900;
      background: linear-gradient(135deg, #00d67f 0%, #00b96d 100%);
      color: #fff;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .rebate-btn:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(0, 214, 127, 0.5);
    }

    .rebate-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      background: var(--bg-3);
      color: var(--text-muted);
    }

    .rebate-btn svg {
      width: 20px;
      height: 20px;
    }

    .rebate-info {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid var(--border);
      font-size: 12px;
      color: var(--text-muted);
    }

    .rebate-info svg {
      width: 14px;
      height: 14px;
      color: var(--gold);
      flex-shrink: 0;
    }

    @media (max-width: 480px) {
      .rebate-stats {
        grid-template-columns: 1fr;
      }
    }
</style>
</head>
<body>
  <header class="zkn-header"><div class="zkn-header-inner"></div></header>

  <div class="rewards-hero">
    <!-- Título com ícone SVG -->
    <h1 class="rewards-title">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="20 12 20 22 4 22 4 12"/>
        <rect x="2" y="7" width="20" height="5"/>
        <line x1="12" y1="22" x2="12" y2="7"/>
        <path d="M12 7H7.5a2.5 2.5 0 0 1 0-5C11 2 12 7 12 7z"/>
        <path d="M12 7h4.5a2.5 2.5 0 0 0 0-5C13 2 12 7 12 7z"/>
      </svg>
      Recompensas
    </h1>
    <p class="rewards-subtitle">
      1 giro grátis por dia. Prêmios de R$ 1 a R$ 10!
    </p>

    <!-- Roleta -->
    <div class="wheel-container">
      <div class="wheel-pointer"></div>
      <div class="wheel" id="wheel">
        <div class="wheel-segment">R$ 1</div>
        <div class="wheel-segment gold">R$ 2</div>
        <div class="wheel-segment">R$ 3</div>
        <div class="wheel-segment green">R$ 5</div>
        <div class="wheel-segment">R$ 7</div>
        <div class="wheel-segment red">R$ 10</div>
        <div class="wheel-center">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>
          </svg>
        </div>
      </div>
    </div>

    <!-- Resultado -->
    <div class="wheel-result" id="result"></div>

    <!-- Botão girar -->
    <button class="wheel-btn" id="spinBtn" onclick="girar()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="23 4 23 10 17 10"/>
        <polyline points="1 20 1 14 7 14"/>
        <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>
      </svg>
      Girar
    </button>

    <!-- Info rollover -->
    <div class="wheel-info">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"/>
        <line x1="12" y1="16" x2="12" y2="12"/>
        <line x1="12" y1="8" x2="12.01" y2="8"/>
      </svg>
      Rollover de 3x sobre o valor ganho
    </div>
  </div>

  
  <!-- SECAO DE REBATE -->
  <div class="rebate-section">
    <div class="rebate-header">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="12" y1="1" x2="12" y2="23"/>
        <path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>
      </svg>
      <h2 class="rebate-title">Cashback</h2>
    </div>
    <p class="rebate-subtitle">Você ganha de volta uma % do que perder nas apostas.</p>

    <div class="rebate-card">
      <div class="rebate-stats">
        <div class="rebate-stat">
          <div class="rebate-stat-label">Disponível</div>
          <div class="rebate-stat-value" id="rebateBalance">R$ 0,00</div>
        </div>
        <div class="rebate-stat">
          <div class="rebate-stat-label">Total acumulado</div>
          <div class="rebate-stat-value gold" id="rebateTotal">R$ 0,00</div>
        </div>
      </div>

      <button class="rebate-btn" id="rebateBtn" onclick="resgatarRebate()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="12" y1="1" x2="12" y2="23"/>
          <path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>
        </svg>
        Resgatar cashback
      </button>

      <div class="rebate-info">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"/>
          <line x1="12" y1="16" x2="12" y2="12"/>
          <line x1="12" y1="8" x2="12.01" y2="8"/>
        </svg>
        <span id="rebateInfo">Carregando...</span>
      </div>
    </div>
  </div>

  
  <script src="assets/config.js"></script>
  <script src="assets/validators.js"></script>
  <script src="assets/auth.js"></script>
  <script src="assets/app.js"></script>
  <script src="assets/bottom-nav.js"></script>
  <script>
    if (!ZKNAuth.requireLogin('recompensas.html')) throw new Error('redirecionado');

    let girando = false;
    let rotacaoAtual = 0;

    async function checkStatus() {
      try {
        const r = await ZKNAuth.api('/roulette/status');
        if (r.ok && r.data.available === false) {
          document.getElementById('spinBtn').disabled = true;
          document.getElementById('spinBtn').innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg> Volte amanhã';
          if (r.data.last_amount) {
            const result = document.getElementById('result');
            result.textContent = 'R$ ' + r.data.last_amount.toFixed(2).replace('.', ',');
            result.style.color = 'var(--gold)';
          }
        }
      } catch (e) {
        console.warn(e);
      }
    }

    async function girar() {
      if (girando) return;
      girando = true;

      const btn = document.getElementById('spinBtn');
      const wheel = document.getElementById('wheel');
      const result = document.getElementById('result');

      btn.disabled = true;
      btn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg> Girando...';
      result.textContent = '';
      result.classList.remove('win');

      try {
        const r = await ZKNAuth.api('/roulette/spin', { method: 'POST' });
        if (!r.ok || !r.data.ok) {
          result.textContent = r.data.message || 'Erro';
          result.style.color = 'var(--red)';
          btn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg> Girar';
          btn.disabled = false;
          girando = false;
          return;
        }

        const valor = r.data.amount;

        // Mapeia valor para ângulo (0=R$1, 1=R$2, etc)
        const valores = [1, 2, 3, 5, 7, 10];
        const idx = valores.indexOf(valor);
        const anguloSetor = (idx * 60) + 30;  // centro do setor

        // Voltas + ângulo
        const voltas = 6;
        rotacaoAtual += voltas * 360 + (360 - anguloSetor);
        wheel.style.transform = 'rotate(' + rotacaoAtual + 'deg)';

        setTimeout(() => {
          result.textContent = 'R$ ' + valor.toFixed(2).replace('.', ',');
          result.style.color = 'var(--green)';
          result.classList.add('win');
          btn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg> Volte amanhã';
          if (window.ZKNSaldo) window.ZKNSaldo.atualizar();
          girando = false;
        }, 4600);
      } catch (e) {
        result.textContent = 'Erro de conexão';
        result.style.color = 'var(--red)';
        btn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg> Girar';
        btn.disabled = false;
        girando = false;
      }
    }

    checkStatus();
  
    // ============================================================
    // REBATE — cashback
    // ============================================================
    async function carregarRebate() {
      try {
        const r = await ZKNAuth.api('/rebate/status');
        if (r.ok && r.data) {
          const d = r.data;
          document.getElementById('rebateBalance').textContent = 'R$ ' + d.balance.toFixed(2).replace('.', ',');
          document.getElementById('rebateTotal').textContent = 'R$ ' + d.total.toFixed(2).replace('.', ',');
          document.getElementById('rebateInfo').textContent =
            'Taxa: ' + (d.rate * 100).toFixed(1) + '% · Mínimo: R$ ' + d.min_claim.toFixed(2).replace('.', ',') + ' · Rollover: ' + d.rollover_multiplier + 'x';

          const btn = document.getElementById('rebateBtn');
          if (d.balance < d.min_claim) {
            btn.disabled = true;
            btn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg> Mínimo R$ ' + d.min_claim.toFixed(2).replace('.', ',');
          } else {
            btn.disabled = false;
          }
        }
      } catch (e) {
        console.warn('[rebate]', e);
      }
    }

    async function resgatarRebate() {
      const btn = document.getElementById('rebateBtn');
      if (btn.disabled) return;

      btn.disabled = true;
      btn.textContent = 'Resgatando...';

      try {
        const r = await ZKNAuth.api('/rebate/claim', { method: 'POST' });
        if (r.ok && r.data.ok) {
          ZKN.toast('Cashback resgatado!', 'R$ ' + r.data.amount.toFixed(2).replace('.', ',') + ' + rollover ' + r.data.rollover.toFixed(2).replace('.', ','));
          if (window.ZKNSaldo) window.ZKNSaldo.atualizar();
          setTimeout(carregarRebate, 1000);
        } else {
          ZKN.toast('Erro', r.data.message || 'Erro ao resgatar', 'error');
          btn.disabled = false;
          carregarRebate();
        }
      } catch (e) {
        ZKN.toast('Erro', 'Erro de conexão', 'error');
        btn.disabled = false;
        carregarRebate();
      }
    }

    // Chama ao carregar
    carregarRebate();</script>
</body>
</html>
