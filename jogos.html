<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https:; style-src 'self' 'unsafe-inline' https:; img-src 'self' data: blob: https:; font-src 'self' data: https:; connect-src 'self' https: wss:; frame-src 'self' https:; media-src 'self' data: blob: https:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self' https:">
  <title>ZKNbet - Catalogo de Jogos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Sora:wght@800&display=swap" rel="stylesheet">
  <link rel="preconnect" href="https://zknbet-api.gabrielrobin63.workers.dev" crossorigin>
  <link rel="stylesheet" href="assets/style.css">
  <link rel="stylesheet" href="assets/icons.css">

  <style>
    /* Evita scroll horizontal acidental no mobile */
    html, body {
      max-width: 100%;
      overflow-x: hidden;
    }

    /* Carrossel Responsivo */
    #carrosselBanners {
      width: 100% !important;
      max-width: 1000px !important;
      margin: 24px auto 0 !important;
      padding: 0 16px !important;
      box-sizing: border-box;
    }
    .carrossel-wrapper {
      max-width: 1280px;
      margin: 0 auto;
      position: relative;
      border-radius: 16px;
      overflow: hidden;
    }
    #carrosselTrack {
      display: flex !important;
      flex-wrap: nowrap !important;
      align-items: flex-start !important;
      touch-action: pan-y !important;
      user-select: none;
      -webkit-user-select: none;
      transition: transform 0.5s ease;
    }
    #carrosselTrack > div {
      flex: 0 0 100% !important;
      min-width: 100% !important;
      width: 100% !important;
      cursor: pointer;
    }
    #carrosselTrack img {
      width: 100% !important;
      height: auto !important;
      display: block !important;
      object-fit: contain !important;
    }

    /* Barra de busca responsiva */
    .search-box-wrapper {
      position: relative;
      margin-bottom: 20px;
      width: 100%;
      max-width: 420px;
    }
    .search-box-input {
      width: 100%;
      box-sizing: border-box;
      padding: 12px 16px 12px 44px;
      background: var(--bg-2);
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-sm);
      color: var(--text);
      font-size: 16px;
      outline: none;
    }

    /* Ajustes específicos para Mobile */
    @media (max-width: 768px) {
      #carrosselBanners {
        margin-top: 14px !important;
        padding: 0 12px !important;
      }
      .carrossel-wrapper {
        border-radius: 12px;
      }
      .winners-ticker {
        margin-top: 14px !important;
      }
      .search-box-wrapper {
        max-width: 100%;
        margin-bottom: 16px;
      }
      .section-header {
        gap: 8px;
      }
      .section-title {
        font-size: 18px;
      }
      .zkn-footer {
        padding-bottom: 84px;
      }
    }
  </style>
</head>
<body>
  <header class="zkn-header"><div class="zkn-header-inner"></div></header>

  <section class="section">
    <div class="section-header">
      <h2 class="section-title">Todos os jogos</h2>
      <span id="gamesCount" style="color:var(--text-muted);font-size:14px;font-weight:600;"></span>
    </div>

    <div id="filtroProviderChip" style="display:none;margin-bottom:16px;align-items:center;gap:8px;background:rgba(245,190,60,0.1);border:1px solid var(--border-gold);border-radius:10px;padding:10px 14px;max-width:420px;">
      <span style="font-size:13px;color:var(--text-muted);">Provedora:</span>
      <strong id="filtroProviderNome" style="font-size:13px;color:var(--gold);"></strong>
      <button onclick="limparFiltroProvider()" style="margin-left:auto;background:transparent;border:none;color:var(--text-muted);font-size:18px;cursor:pointer;padding:0;line-height:1;">&times;</button>
    </div>
    <div style="position:relative;margin-bottom:20px;max-width:420px;">
      <input type="text" id="busca" placeholder="Buscar jogo..."
             style="width:100%;padding:12px 16px 12px 44px;background:var(--bg-2);border:1px solid var(--border-strong);border-radius:var(--radius-sm);color:var(--text);font-size:16px;outline:none;">
      <span style="position:absolute;left:16px;top:50%;transform:translateY(-50%);color:var(--text-muted);">&#128269;</span>
    </div>

    <div class="games-carousel" id="grid">
      <div class="game-card" style="grid-column:1/-1;text-align:center;padding:40px;color:var(--text-muted);">Carregando jogos...</div>
    </div>
  </section>

  <section class="section" id="provedorasSectionJogos" style="padding-top:0;">
    <div class="section-header">
      <h2 class="section-title">Provedoras parceiras</h2>
      <a href="provedoras.html" class="section-link">Ver todas &rarr;</a>
    </div>
    <div class="providers-strip" id="providersStripJogos"></div>
  </section>

  <footer class="zkn-footer">
    <div class="zkn-footer-inner">
      <p><strong>ZKNbet</strong> (c) 2026 - Todos os direitos reservados</p>
      <p class="disclaimer">Proibido para menores de 18 anos. Jogue com responsabilidade.</p>
    </div>
  </footer>

  <script src="assets/loading.js"></script>
  <script src="assets/config.js"></script>
  <script src="assets/validators.js"></script>
  <script src="assets/auth.js"></script>
  <script src="assets/app.js"></script>
  <script src="assets/game-frame.js"></script>
  <script src="assets/daily-bonus.js"></script>
  <script src="assets/bottom-nav.js"></script>
  <script src="assets/rapidverse.js"></script>
  <script src="assets/games-lib.js"></script>
  <script>
    let ALL_GAMES = [];
    let filtro = '';

    // Pasta das capas locais. ATENCAO: o nome precisa ser IDENTICO ao do GitHub
    // (o Windows ignora maiuscula/minuscula, o servidor nao).
    const PASTA_CAPAS = 'img/PGsoft';

    // Filtro por provedora via URL (?provider=PG%20Soft)
    const _params = new URLSearchParams(location.search);
    const _providerFiltro = _params.get('provider');
    if (_providerFiltro) {
      filtro = _providerFiltro;
    }

    // Se a capa local falhar, tenta a image_url do banco; se falhar tambem, mostra a inicial.
    function capaFalhou(img) {
      const fb = img.dataset.fb;
      if (fb && !img.dataset.tentou) {
        img.dataset.tentou = '1';
        img.src = fb;
        return;
      }
      img.style.display = 'none';
      if (!img.parentNode.querySelector('.fallback-txt')) {
        const span = document.createElement('span');
        span.className = 'fallback-txt';
        span.textContent = img.dataset.inicial || '?';
        span.style.cssText = 'position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:36px;font-weight:bold;color:var(--gold);';
        img.parentNode.appendChild(span);
      }
    }

    function renderGrid() {
      const grid = document.getElementById('grid');
      const busca = filtro.toLowerCase().trim();

      const lista = ALL_GAMES.filter(g => {
        if (!busca) return true;
        const hay = (g.name + ' ' + (g.provider_name || '')).toLowerCase();
        return hay.includes(busca);
      });

      document.getElementById('gamesCount').textContent = lista.length + ' jogos';

      if (lista.length === 0) {
        grid.innerHTML = '<div class="game-card" style="grid-column:1/-1;text-align:center;padding:40px;color:var(--text-muted);">Nenhum jogo encontrado.</div>';
        return;
      }

      grid.innerHTML = lista.map(j => {
        const codigoImg = j.vendor_game_code || j.game_code;
        const capaLocal = codigoImg ? `${PASTA_CAPAS}/${codigoImg}.png` : '';
        const fallback = escapeHtml(j.image_url || '');
        const inicial = (j.name || '?').charAt(0).toUpperCase();
        const nomeSafe = escapeHtml(j.name);
        const providerSafe = escapeHtml(j.provider_name || '');
        const capaSafe = escapeHtml(capaLocal);
        return `
          <div class="game-card" onclick="jogar('${escapeJsAttr(j.game_code)}', '${escapeJsAttr(j.name)}')">
            <div class="game-card-cover">
              <img src="${capaSafe}" alt="${nomeSafe}" loading="lazy" decoding="async"
                   data-fb="${fallback}" data-inicial="${escapeHtml(inicial)}" onerror="capaFalhou(this)">
              <div class="game-card-play"><div class="play-btn">&#9654;</div></div>
            </div>
            <div class="game-card-info">
              <div class="game-card-name" title="${nomeSafe}">${nomeSafe}</div>
              <div class="game-card-provider">${providerSafe}</div>
            </div>
          </div>
        `;
      }).join('');
    }

    async function jogar(code, nome) {
      if (!ZKNAuth.isLoggedIn()) {
        ZKN.toast('Faca login', 'Entre para jogar.', 'warning');
        setTimeout(() => location.href = 'login.html?back=jogos.html', 800);
        return;
      }

      const user = ZKNAuth.getUser();
      const email = user.email || (user.phone + '@zknbet.com');

      ZKN.toast('Abrindo jogo...', nome || code);
      const res = await Rapidverse.abrirJogo(code, email);

      if (res.sucesso && res.launch_url) {
        if (window.ZKNGameFrame && window.ZKNGameFrame.abrir) { window.ZKNGameFrame.abrir(res.launch_url, nome || code); } else { window.open(res.launch_url, '_blank', 'noopener'); }
      } else {
        ZKN.toast('Erro ao abrir jogo', res.mensagem || 'Tente novamente.', 'error');
      }
    }

    function atualizarChipFiltro() {
      const chip = document.getElementById('filtroProviderChip');
      const nome = document.getElementById('filtroProviderNome');
      const urlProvider = new URLSearchParams(location.search).get('provider');
      if (urlProvider && chip && nome) {
        chip.style.display = 'flex';
        nome.textContent = urlProvider;
      } else if (chip) {
        chip.style.display = 'none';
      }
    }

    function limparFiltroProvider() {
      const url = new URL(location.href);
      url.searchParams.delete('provider');
      history.replaceState(null, '', url.toString());
      filtro = '';
      document.getElementById('busca').value = '';
      document.getElementById('filtroProviderChip').style.display = 'none';
      renderGrid();
    }

    function renderProvidersStripJogos() {
      const strip = document.getElementById('providersStripJogos');
      if (!strip) return;
      if (!window.ZKNProviders || !window.ZKNProviders.aplicarProvidersReais) return;

      const jogosReais = window.ZKNProviders.aplicarProvidersReais(ALL_GAMES);
      const contagem = {};
      jogosReais.forEach(function(j) {
        const p = (j.provider_name || 'Outra').trim();
        if (!p) return;
        contagem[p] = (contagem[p] || 0) + 1;
      });
      const lista = Object.keys(contagem)
        .map(function(name) { return { name: name, count: contagem[name] }; })
        .sort(function(a, b) { return b.count - a.count || a.name.localeCompare(b.name); });

      if (lista.length === 0) { strip.innerHTML = ''; return; }

      strip.innerHTML = lista.map(function(p) {
        const url = 'jogos.html?provider=' + encodeURIComponent(p.name);
        return '<div class="provider-chip" onclick="location.href=\'' + url + '\'" style="cursor:pointer;">' +
          '<div style="font-weight:800;font-size:14px;color:#fff;">' + escapeHtml(p.name) + '</div>' +
          '<div style="font-size:11px;color:var(--text-muted);margin-top:4px;">' + p.count + ' jogos</div>' +
        '</div>';
      }).join('');
    }

    async function iniciar() {
      const res = await Rapidverse.listarJogos();
      if (!res.sucesso) {
        document.getElementById('grid').innerHTML =
          '<div class="game-card" style="grid-column:1/-1;text-align:center;padding:40px;color:var(--red);">' +
          (res.mensagem || 'Erro ao carregar jogos.') + '</div>';
        return;
      }
      ALL_GAMES = window.ZKNProviders ? window.ZKNProviders.aplicarProvidersReais(res.jogos || []) : (res.jogos || []);
      renderGrid();
      renderProvidersStripJogos();
    }

    document.getElementById('busca').addEventListener('input', (e) => {
      filtro = e.target.value;
      renderGrid();
    });

    // Preenche o input de busca com o provider da URL (se houver) e mostra o chip
    if (_providerFiltro) {
      const _buscaInput = document.getElementById('busca');
      if (_buscaInput) _buscaInput.value = _providerFiltro;
      atualizarChipFiltro();
    }

    iniciar();
  </script>
</body>
</html>
