<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https:; style-src 'self' 'unsafe-inline' https:; img-src 'self' data: blob: https:; font-src 'self' data: https:; connect-src 'self' https: wss:; frame-src 'self' https:; media-src 'self' data: blob: https:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self' https:">
  <title>ZKNbet — Catálogo de Jogos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Sora:wght@800&display=swap" rel="stylesheet">
  <link rel="preconnect" href="https://zknbet-api.gabrielrobin63.workers.dev" crossorigin>
  <link rel="stylesheet" href="assets/style.css">
  <link rel="stylesheet" href="assets/icons.css">
  <link rel="stylesheet" href="assets/events.css">
</head>
<body>
  <header class="zkn-header"><div class="zkn-header-inner"></div></header>

  <section class="section">
    <div class="section-header">
      <h2 class="section-title">Todos os jogos</h2>
      <span id="gamesCount" style="color:var(--text-muted);font-size:14px;font-weight:600;"></span>
    </div>

    <div id="filtroProviderChip" style="display:none;margin-bottom:16px;align-items:center;gap:8px;background:rgba(245,190,60,0.1);border:1px solid var(--border-gold);border-radius:10px;padding:10px 14px;max-width:420px;">
      <span style="font-size:13px;color:var(--text-muted);">Provedora:</span>
      <strong id="filtroProviderNome" style="font-size:13px;color:var(--gold);"></strong>
      <button onclick="limparFiltroProvider()" style="margin-left:auto;background:transparent;border:none;color:var(--text-muted);font-size:18px;cursor:pointer;padding:0;line-height:1;">&times;</button>
    </div>

    <div class="catalog-controls">
      <div class="search-box-wrapper" style="margin-bottom:0;">
        <input type="text" id="busca" class="search-box-input" placeholder="Buscar jogo ou provedora..." aria-label="Buscar jogo">
        <span style="position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--text-muted);pointer-events:none;display:inline-flex;"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></span>
      </div>
      <select id="sortSelect" class="sort-select" aria-label="Ordenar jogos">
        <option value="az">Ordem alfabética (A–Z)</option>
        <option value="featured">Mais populares</option>
        <option value="rtp">Maior RTP</option>
      </select>
    </div>

    <div class="cat-pills" id="catPills" role="tablist" aria-label="Categorias de jogos">
      <button type="button" class="cat-pill active" data-cat="all">Todos</button>
      <button type="button" class="cat-pill" data-cat="slots">Slots</button>
      <button type="button" class="cat-pill" data-cat="crash">Crash &amp; Instant</button>
      <button type="button" class="cat-pill" data-cat="mesa">Mesa &amp; Cassino</button>
    </div>

    <div class="provider-pills" id="providerPillsJogos" role="tablist" aria-label="Filtrar por provedora" style="display:none;"></div>

    <div class="games-carousel" id="grid"></div>
    <div class="games-disclosure" id="gamesDisclosureJogos" style="display:none;">
      <p class="games-disclosure-count" id="gamesDisclosureCountJogos"></p>
      <button type="button" class="games-disclosure-btn" id="gamesDisclosureBtnJogos">Carregar mais</button>
    </div>
  </section>

  <section class="section" id="provedorasSectionJogos" style="padding-top:0;">
    <div class="section-header">
      <h2 class="section-title">Provedoras parceiras</h2>
      <a href="provedoras.html" class="section-link">Ver todas &rarr;</a>
    </div>
    <div class="providers-strip" id="providersStripJogos"></div>
  </section>

  <footer class="zkn-footer">
    <div class="zkn-footer-inner">
      <p><strong>ZKNbet</strong> &copy; 2026 &middot; Todos os direitos reservados</p>
      <p class="disclaimer">Proibido para menores de 18 anos. Jogue com responsabilidade.</p>
    </div>
  </footer>

  <script src="assets/loading.js"></script>
  <script src="assets/config.js"></script>
  <script src="assets/validators.js"></script>
  <script src="assets/auth.js"></script>
  <script src="assets/app.js"></script>
  <script src="assets/game-frame.js"></script>
  <script src="assets/daily-bonus.js"></script>
  <script src="assets/bottom-nav.js"></script>
  <script src="assets/rapidverse.js"></script>
  <script src="assets/games-lib.js"></script>
  <script>
    let ALL_GAMES = [];
    let filtro = '';
    let categoriaAtiva = 'all';
    let sortAtivo = 'az';
    let _providerFiltro = new URLSearchParams(location.search).get('provider') || '';

    const ORDEM_POPULARES = [
      'Fortune Tiger', 'Fortune Ox', 'Fortune Rabbit', 'Fortune Mouse', 'Fortune Dragon',
      'Gates of Olympus', 'Sweet Bonanza', 'Sugar Rush', 'Big Bass Splash', 'Starlight Princess',
    ];
    const POP_IDX = {};
    ORDEM_POPULARES.forEach((n, i) => { POP_IDX[n.toLowerCase()] = i; });

    function renderGrid() {
      const grid = document.getElementById('grid');
      const busca = filtro.toLowerCase().trim();
      const provFiltro = _providerFiltro.toLowerCase().trim();

      let lista = ALL_GAMES.filter(g => {
        if (provFiltro) {
          const pName = (g.provider_name || '').toLowerCase();
          const vCode = (g.vendor_code || '').toLowerCase();
          if (pName !== provFiltro && vCode !== provFiltro) return false;
        }
        if (categoriaAtiva !== 'all' && ZKNGamesLib.classificarCategoria(g) !== categoriaAtiva) {
          return false;
        }
        if (!busca) return true;
        const hay = ((g.name || '') + ' ' + (g.provider_name || '') + ' ' + (g.vendor_code || '')).toLowerCase();
        return hay.includes(busca);
      });

      if (sortAtivo === 'featured') {
        lista = [...lista].sort((a, b) => {
          const ia = POP_IDX[(a.name || '').toLowerCase()];
          const ib = POP_IDX[(b.name || '').toLowerCase()];
          if (ia !== undefined && ib !== undefined) return ia - ib;
          if (ia !== undefined) return -1;
          if (ib !== undefined) return 1;
          return (a.name || '').localeCompare(b.name || '');
        });
      } else if (sortAtivo === 'rtp') {
        lista = [...lista].sort((a, b) => Number(b.rtp || 0) - Number(a.rtp || 0) || (a.name || '').localeCompare(b.name || ''));
      } else {
        lista = [...lista].sort((a, b) => (a.name || '').localeCompare(b.name || ''));
      }

      document.getElementById('gamesCount').textContent = lista.length + ' jogos';
      window.ZKNGamesLib.renderGameSection(grid, lista);
    }

    async function jogar(code, nome) {
      return window.ZKNGamesLib.abrirJogo(code, nome);
    }

    function atualizarChipFiltro() {
      const chip = document.getElementById('filtroProviderChip');
      const nome = document.getElementById('filtroProviderNome');
      if (_providerFiltro && chip && nome) {
        chip.style.display = 'flex';
        nome.textContent = _providerFiltro;
      } else if (chip) {
        chip.style.display = 'none';
      }
    }

    function limparFiltroProvider() {
      const url = new URL(location.href);
      url.searchParams.delete('provider');
      history.replaceState(null, '', url.toString());
      _providerFiltro = '';
      filtro = '';
      document.getElementById('busca').value = '';
      document.getElementById('filtroProviderChip').style.display = 'none';
      document.querySelectorAll('#providerPillsJogos .provider-pill').forEach(b => {
        b.classList.toggle('active', b.dataset.provider === '');
      });
      renderGrid();
    }

    function renderProviderPillsJogos() {
      const wrap = document.getElementById('providerPillsJogos');
      if (!wrap) return;
      const contagem = {};
      ALL_GAMES.forEach(g => {
        const p = (g.provider_name || '').trim();
        if (p) contagem[p] = (contagem[p] || 0) + 1;
      });
      const nomes = Object.keys(contagem).sort((a, b) => contagem[b] - contagem[a] || a.localeCompare(b));
      if (!nomes.length) { wrap.style.display = 'none'; return; }

      wrap.style.display = 'flex';
      const activeProv = _providerFiltro.trim().toLowerCase();
      wrap.innerHTML = [''].concat(nomes).map(p => {
        const isAct = p === '' ? activeProv === '' : p.toLowerCase() === activeProv;
        const label = p === '' ? 'Todas provedoras' : escapeHtml(p);
        return '<button type="button" class="provider-pill' + (isAct ? ' active' : '') + '" data-provider="' + escapeHtml(p) + '">' + label + '</button>';
      }).join('');

      wrap.querySelectorAll('.provider-pill').forEach(btn => {
        btn.addEventListener('click', () => {
          wrap.querySelectorAll('.provider-pill').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          _providerFiltro = btn.dataset.provider || '';
          const url = new URL(location.href);
          if (_providerFiltro) url.searchParams.set('provider', _providerFiltro);
          else url.searchParams.delete('provider');
          history.replaceState(null, '', url.toString());
          atualizarChipFiltro();
          renderGrid();
        });
      });
    }

    function renderProvidersStripJogos() {
      const strip = document.getElementById('providersStripJogos');
      if (!strip) return;
      if (!window.ZKNProviders || !window.ZKNProviders.aplicarProvidersReais) return;

      const jogosReais = window.ZKNProviders.aplicarProvidersReais(ALL_GAMES);
      const contagem = {};
      jogosReais.forEach(function(j) {
        const p = (j.provider_name || 'Outra').trim();
        if (!p) return;
        contagem[p] = (contagem[p] || 0) + 1;
      });
      const lista = Object.keys(contagem)
        .map(function(name) { return { name: name, count: contagem[name] }; })
        .sort(function(a, b) { return b.count - a.count || a.name.localeCompare(b.name); });

      if (lista.length === 0) { strip.innerHTML = ''; return; }

      strip.innerHTML = lista.map(function(p) {
        const url = 'jogos.html?provider=' + encodeURIComponent(p.name);
        return '<div class="provider-chip" onclick="location.href=\'' + url + '\'" style="cursor:pointer;">' +
          '<div style="font-weight:800;font-size:14px;color:#fff;">' + escapeHtml(p.name) + '</div>' +
          '<div style="font-size:11px;color:var(--text-muted);margin-top:4px;">' + p.count + ' jogos</div>' +
        '</div>';
      }).join('');
    }

    async function iniciar() {
      if (window.ZKNGamesLib?.renderSkeletons) {
        ZKNGamesLib.renderSkeletons(document.getElementById('grid'), 16);
      }
      const res = await Rapidverse.listarJogos();
      if (!res.sucesso) {
        document.getElementById('grid').innerHTML =
          '<div class="game-card" style="grid-column:1/-1;text-align:center;padding:40px;color:var(--red);">' +
          escapeHtml(res.mensagem || 'Erro ao carregar jogos.') + '</div>';
        return;
      }
      ALL_GAMES = window.ZKNProviders ? window.ZKNProviders.aplicarProvidersReais(res.jogos || []) : (res.jogos || []);
      if (ZKNAuth.isLoggedIn() && window.ZKNGamesLib) {
        await ZKNGamesLib.carregarFavoritos();
      }
      renderProviderPillsJogos();
      renderGrid();
      renderProvidersStripJogos();
    }

    let _buscaTimer = null;
    document.getElementById('busca').addEventListener('input', (e) => {
      filtro = e.target.value;
      clearTimeout(_buscaTimer);
      _buscaTimer = setTimeout(renderGrid, 120);
    });
    document.getElementById('sortSelect').addEventListener('change', (e) => {
      sortAtivo = e.target.value;
      renderGrid();
    });
    document.querySelectorAll('#catPills .cat-pill').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('#catPills .cat-pill').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        categoriaAtiva = btn.dataset.cat || 'all';
        renderGrid();
      });
    });

    if (_providerFiltro) atualizarChipFiltro();
    iniciar();
  </script>
</body>
</html>
