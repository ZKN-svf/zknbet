<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZKNbet — Saque PIX</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Sora:wght@600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <header class="zkn-header"><div class="zkn-header-inner"></div></header>

  <div class="saque-wrap">
    <div class="saldo-info">
      <span class="label">Saldo disponível para saque</span>
      <span class="val" data-balance>R$ 0,00</span>
    </div>

    <div class="card" style="max-width:none;width:100%;">
      <h1>💸 Saque via PIX</h1>
      <p class="subtitle">Digite o valor e sua senha de 6 dígitos para confirmar.</p>

      <label for="valorSaque">Valor do saque (R$)</label>
      <input type="number" id="valorSaque" placeholder="20,00" step="0.01" min="20" style="font-size:18px;font-weight:700;">

      <label for="pin">Senha de saque (6 dígitos)</label>
      <input type="password" id="pin" inputmode="numeric" maxlength="6" placeholder="••••••" autocomplete="off">

      <button id="btnSaque" class="btn-primary btn-block">Solicitar Saque</button>

      <div class="status-box" id="statusBox"></div>
    </div>
  </div>

  <script src="assets/loading.js"></script>
  <script src="assets/config.js"></script>
  <script src="assets/validators.js"></script>
  <script src="assets/auth.js"></script>
  <script src="assets/app.js"></script>
  <script src="assets/sigilopay.js"></script>
  <script>
    if (!ZKNAuth.requireLogin('saque.html')) throw new Error('redirecionado');

    // Se ainda não tem PIN de saque, redireciona para configurar
    if (!ZKNAuth.temPinSaque()) {
      location.href = 'saque-primeiro-acesso.html';
      throw new Error('sem pin');
    }

    // ---------- Saldo real ----------
    ZKNAuth.getSaldo();

    // ---------- Helpers ----------
    function setStatus(tipo, msg) {
      const box = document.getElementById('statusBox');
      box.className = 'status-box active ' + tipo;
      box.innerHTML = msg;
    }

    const pinEl = document.getElementById('pin');
    pinEl.addEventListener('input', () => {
      pinEl.value = pinEl.value.replace(/\D/g, '').slice(0, 6);
    });

    const valorEl = document.getElementById('valorSaque');
    valorEl.addEventListener('input', () => {
      // só limpa status anterior ao digitar de novo
      document.getElementById('statusBox').className = 'status-box';
    });

    // ---------- Solicitar saque ----------
    document.getElementById('btnSaque').onclick = async () => {
      const btn = document.getElementById('btnSaque');
      const valor = parseFloat(document.getElementById('valorSaque').value);
      const pin = pinEl.value;

      // Validacoes ANTES de tocar no botao
      if (!valor || valor < 20) {
        return setStatus('error', 'Valor minimo de saque: R$ 20,00 (exigencia da SigiloPay).');
      }
      if (valor > ZKN.ZKN_USER.balance) {
        return setStatus('error', `Saldo insuficiente. Você tem ${ZKN.formatBRL(ZKN.ZKN_USER.balance)}.`);
      }
      if (!/^\d{6}$/.test(pin)) {
        return setStatus('error', 'Informe o PIN de 6 dígitos.');
      }

      btn.disabled = true;
      btn.textContent = 'Verificando PIN...';
      setStatus('pending', 'Verificando PIN...');

      try {
        // 1) Verifica PIN (com timeout de 15s)
        const pinOk = await Promise.race([
          ZKNAuth.verificarPinSaque(pin),
          new Promise((_, rej) => setTimeout(() => rej(new Error('Timeout ao verificar PIN. Tente novamente.')), 15000))
        ]);

        if (!pinOk || !pinOk.sucesso) {
          return setStatus('error', (pinOk && pinOk.mensagem) || 'PIN incorreto.');
        }

        // 2) Pega os dados de saque
        const dados = ZKNAuth.getDadosSaque();
        if (!dados || !dados.pixKey) {
          return setStatus('error', 'Chave PIX não encontrada. Refaça o cadastro de saque.');
        }

        btn.textContent = 'Enviando para SigiloPay...';
        setStatus('pending', 'Processando saque...');

        // 3) Cria a transferencia (com timeout de 30s)
        const res = await Promise.race([
          SigiloPay.criarTransferencia(valor, dados.pixKey, {
            nome: dados.holderName,
            cpf: dados.holderCpf,
          }),
          new Promise((_, rej) => setTimeout(() => rej(new Error('Timeout ao processar saque. Tente novamente em instantes.')), 30000))
        ]);

        if (res && res.sucesso) {
          setStatus('success', `✅ Saque de ${ZKN.formatBRL(valor)} solicitado!<br>Status: ${res.status || 'PENDENTE'}.`);
          ZKN.ZKN_USER.balance = ZKN.ZKN_USER.balance - valor;
          ZKN.toast('Saque solicitado!', `${ZKN.formatBRL(valor)} em processamento.`);
          document.getElementById('valorSaque').value = '';
          pinEl.value = '';
        } else {
          setStatus('error', (res && res.mensagem) || 'Erro ao processar saque.');
          ZKN.toast('Erro no saque', (res && res.mensagem) || 'Tente novamente.', 'error');
        }
      } catch (e) {
        // QUALQUER erro cai aqui e destrava o botao
        setStatus('error', 'Erro: ' + (e.message || 'Falha na conexao'));
        ZKN.toast('Erro no saque', e.message || 'Verifique a conexao.', 'error');
      } finally {
        // SEMPRE destrava o botao, aconteca o que acontecer
        btn.disabled = false;
        btn.textContent = 'Solicitar Saque';
      }
    };</script>
</body>
</html>
