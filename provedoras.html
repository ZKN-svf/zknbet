<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZKNbet — Provedoras</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Sora:wght@800&display=swap" rel="stylesheet">
  <link rel="preconnect" href="https://zknbet-api.gabrielrobin63.workers.dev" crossorigin>
  <link rel="preconnect" href="https://nitrogames.pladarck.shop" crossorigin>
  <link rel="dns-prefetch" href="https://nitrogames.pladarck.shop">
  <link rel="stylesheet" href="assets/style.css">
  <link rel="stylesheet" href="assets/icons.css">
  <script src="assets/loading.js"></script>
</head>
<body>
  <header class="zkn-header"><div class="zkn-header-inner"></div></header>

  <section class="section">
    <div class="section-header">
      <h2 class="section-title"><span class="ico ico-trophy"></span> Provedoras parceiras</h2>
      <span id="count" style="color:var(--text-muted);font-size:14px;font-weight:600;"></span>
    </div>

    <div class="providers-strip" id="grid" style="grid-template-columns:repeat(auto-fill,minmax(200px,1fr));">
      <div class="game-card" style="grid-column:1/-1;text-align:center;padding:40px;color:var(--text-muted);">Carregando...</div>
    </div>
  </section>

  <footer class="zkn-footer">
    <div class="zkn-footer-inner">
      <p><strong>ZKNbet</strong> © 2026 · Todos os direitos reservados</p>
      <p class="disclaimer">Proibido para menores de 18 anos. Jogue com responsabilidade.</p>
    </div>
  </footer>

  <script src="assets/loading.js"></script>
  <script src="assets/config.js"></script>
  <script src="assets/validators.js"></script>
  <script src="assets/auth.js"></script>
  <script src="assets/app.js"></script>
  <script src="assets/bottom-nav.js"></script>
  <script src="assets/game-frame.js"></script>
  <script src="assets/providers-map.js"></script>
  <script src="assets/nitrogames.js"></script>
  <script>
    async function iniciar() {
      const grid = document.getElementById('grid');
      const countEl = document.getElementById('count');

      try {
        console.log('[PROVEDORAS] iniciando...');
        console.log('[PROVEDORAS] ZKNProviders existe?', typeof window.ZKNProviders);
        console.log('[PROVEDORAS] NitroGames existe?', typeof NitroGames);

        if (typeof NitroGames === 'undefined' || !NitroGames.listarJogos) {
          throw new Error('NitroGames nao carregou');
        }

        const res = await NitroGames.listarJogos();
        console.log('[PROVEDORAS] resposta:', res);

        if (!res || !res.sucesso) {
          throw new Error((res && res.mensagem) || 'Erro ao carregar jogos');
        }

        const jogosBrutos = res.jogos || [];
        console.log('[PROVEDORAS] jogos brutos:', jogosBrutos.length);

        const jogos = (window.ZKNProviders && window.ZKNProviders.aplicarProvidersReais)
          ? window.ZKNProviders.aplicarProvidersReais(jogosBrutos)
          : jogosBrutos;

        const contagem = {};
        jogos.forEach(function(j) {
          const p = j.provider_name || 'Outra';
          contagem[p] = (contagem[p] || 0) + 1;
        });

        const lista = Object.keys(contagem)
          .map(function(name) { return { name: name, count: contagem[name] }; })
          .sort(function(a, b) { return b.count - a.count; });

        console.log('[PROVEDORAS] lista:', lista);

        countEl.textContent = lista.length + ' provedoras';

        if (lista.length === 0) {
          grid.innerHTML = '<div class="game-card" style="grid-column:1/-1;text-align:center;padding:40px;color:var(--text-muted);">Nenhuma provedora encontrada.</div>';
          return;
        }

        grid.innerHTML = lista.map(function(p) {
          return '<div class="provider-chip" onclick="location.href=\'jogos.html\'" style="padding:28px 20px;">' +
            '<div style="font-size:32px;margin-bottom:8px;">' + String.fromCodePoint(0x1F3B0) + '</div>' +
            '<div style="font-size:15px;margin-bottom:4px;">' + p.name + '</div>' +
            '<div style="font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.4px;">' + p.count + ' jogos</div>' +
          '</div>';
        }).join('');

      } catch (e) {
        console.error('[PROVEDORAS] erro:', e);
        grid.innerHTML = '<div class="game-card" style="grid-column:1/-1;text-align:center;padding:40px;color:var(--red);">Erro: ' + (e.message || 'desconhecido') + '</div>';
        countEl.textContent = 'erro';
      }
    }
    iniciar();
  </script>
</body>
</html>
