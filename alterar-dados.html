<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZKNbet — Alterar Dados</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Sora:wght@600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <header class="zkn-header"><div class="zkn-header-inner"></div></header>

  <div class="auth-wrap">
    <div class="card auth-card">
      <h1>✏️ Alterar dados</h1>
      <p class="subtitle">Atualize seu nome ou celular.</p>

      <label for="name">Nome completo</label>
      <input type="text" id="name" autocomplete="name">

      <label for="email">E-mail</label>
      <input type="email" id="email" autocomplete="email">
      <p class="field-hint">Usado para login e integração com jogos.</p>

      <label for="phone">Celular</label>
      <input type="tel" id="phone" inputmode="numeric" autocomplete="tel">
      <p class="field-hint">Alterar o celular mudará seu login.</p>

      <button id="btnSalvar" class="btn-primary btn-block">Salvar alterações</button>
      <p class="auth-alt"><a href="minha-conta.html">← Voltar</a></p>
    </div>
  </div>

  <script src="assets/loading.js"></script>
  <script src="assets/config.js"></script>
  <script src="assets/validators.js"></script>
  <script src="assets/auth.js"></script>
  <script src="assets/app.js"></script>
  <script>
    if (!ZKNAuth.requireLogin('alterar-dados.html')) throw new Error('redirecionado');

    const user = ZKNAuth.getUser();
    const nameEl = document.getElementById('name');
    const phoneEl = document.getElementById('phone');

    nameEl.value = user.name;
    phoneEl.value = user.phone;
    phoneEl.addEventListener('input', () => window.ZKNVal.mascaraCelular(phoneEl));

    document.getElementById('btnSalvar').onclick = async () => {
      const name = nameEl.value.trim();
      const phone = window.ZKNVal.normalizarCelular(phoneEl.value);

      if (!name || name.length < 3) return ZKN.toast('Nome inválido', 'Digite seu nome completo.', 'error');
      if (!window.ZKNVal.validarCelular(phone)) return ZKN.toast('Celular inválido', 'Digite DDD + 9 + 8 dígitos.', 'error');

      const btn = document.getElementById('btnSalvar');
      btn.disabled = true;
      btn.textContent = 'Salvando...';

      const r = await ZKNAuth.atualizarDados({ name, phone });
      btn.disabled = false;
      btn.textContent = 'Salvar alterações';

      if (!r.sucesso) return ZKN.toast('Erro', r.mensagem, 'error');
      ZKN.toast('Dados atualizados!', 'Suas informações foram salvas.');
      setTimeout(() => location.href = 'minha-conta.html', 800);
    };
  </script>
</body>
</html>
