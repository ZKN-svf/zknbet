<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZKNbet — Histórico</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Sora:wght@600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <header class="zkn-header"><div class="zkn-header-inner"></div></header>

  <div class="ref-container">
    <div class="section-header">
      <h2 class="section-title">📜 Histórico de transações</h2>
    </div>

    <div class="filter-bar" id="filtros" style="margin-bottom:20px;"></div>

    <div class="ref-table-wrap">
      <table class="ref-table">
        <thead>
          <tr>
            <th>Tipo</th>
            <th>Data</th>
            <th>Valor</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody id="tbody">
          <tr><td colspan="4" style="text-align:center;padding:40px;color:var(--text-muted);">Carregando...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <script src="assets/loading.js"></script>
  <script src="assets/config.js"></script>
  <script src="assets/validators.js"></script>
  <script src="assets/auth.js"></script>
  <script src="assets/app.js"></script>
  <script>
    if (!ZKNAuth.requireLogin('historico.html')) throw new Error('redirecionado');

    let todas = [];
    let filtro = 'all';

    const LABELS = { deposit: 'Depósito', withdraw: 'Saque', bet: 'Aposta', win: 'Ganho' };

    function render() {
      const lista = filtro === 'all' ? todas : todas.filter(t => t.type === filtro);
      const tbody = document.getElementById('tbody');
      if (!lista.length) {
        tbody.innerHTML = '<tr><td colspan="4" style="text-align:center;padding:40px;color:var(--text-muted);">Nenhuma transação.</td></tr>';
        return;
      }
      tbody.innerHTML = lista.map(t => {
        const positivo = t.type === 'deposit' || t.type === 'win';
        const sinal = positivo ? '+' : '-';
        const dt = new Date(t.createdAt);
        return `
          <tr>
            <td style="font-weight:700;">${LABELS[t.type] || t.type}</td>
            <td style="color:var(--text-muted);">${dt.toLocaleDateString('pt-BR')} ${dt.toLocaleTimeString('pt-BR', {hour:'2-digit',minute:'2-digit'})}</td>
            <td style="font-weight:800;color:${positivo ? 'var(--green)' : 'var(--red)'};">${sinal}${ZKN.formatBRL(Math.abs(t.amount))}</td>
            <td><span class="status-pill ${t.status === 'completed' ? 'active' : 'pending'}">${t.status === 'completed' ? 'Concluído' : 'Pendente'}</span></td>
          </tr>
        `;
      }).join('');
    }

    function montarFiltros() {
      const barra = document.getElementById('filtros');
      const tipos = ['all', 'deposit', 'withdraw', 'bet', 'win'];
      barra.innerHTML = '';
      tipos.forEach(t => {
        const b = document.createElement('button');
        b.textContent = t === 'all' ? 'Todos' : LABELS[t];
        b.className = t === 'all' ? 'active' : 'secondary';
        b.onclick = () => {
          filtro = t;
          document.querySelectorAll('#filtros button').forEach(x => x.classList.remove('active'));
          b.classList.add('active');
          render();
        };
        barra.appendChild(b);
      });
    }

    async function iniciar() {
      montarFiltros();
      todas = await ZKNAuth.getTransacoes();
      render();
    }

    iniciar();
  </script>
</body>
</html>
