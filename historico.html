<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https:; style-src 'self' 'unsafe-inline' https:; img-src 'self' data: blob: https:; font-src 'self' data: https:; connect-src 'self' https: wss:; frame-src 'self' https:; media-src 'self' data: blob: https:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self' https:">
  <title>ZKNbet — Histórico</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Sora:wght@800&display=swap" rel="stylesheet">
  <link rel="preconnect" href="https://zknbet-api.gabrielrobin63.workers.dev" crossorigin>
  <link rel="stylesheet" href="assets/style.css">
  <link rel="stylesheet" href="assets/icons.css">
  <link rel="stylesheet" href="assets/events.css">
</head>
<body>
  <header class="zkn-header"><div class="zkn-header-inner"></div></header>

  <div class="ref-container">
    <div class="section-header">
      <h2 class="section-title"><span class="ico ico-history"></span> Histórico</h2>
      <div class="filter-bar" id="viewTabs" style="margin-bottom:0;">
        <button class="active" data-view="wallet" onclick="trocarVisao('wallet', this)">Carteira</button>
        <button class="secondary" data-view="bets" onclick="trocarVisao('bets', this)">Apostas nos Jogos</button>
      </div>
    </div>

    <div class="filter-bar" id="filtros" style="margin-bottom:20px;"></div>

    <div class="ref-table-wrap">
      <table class="ref-table" id="histTable">
        <thead id="thead">
          <tr>
            <th>Tipo</th>
            <th>Data</th>
            <th>Valor</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody id="tbody">
          <tr><td colspan="4" style="text-align:center;padding:40px;color:var(--text-muted);">Carregando...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <footer class="zkn-footer">
    <div class="zkn-footer-inner">
      <p><strong>ZKNbet</strong> &copy; 2026 &middot; Todos os direitos reservados</p>
      <p class="disclaimer">Proibido para menores de 18 anos. Jogue com responsabilidade.</p>
    </div>
  </footer>

  <script src="assets/loading.js"></script>
  <script src="assets/config.js"></script>
  <script src="assets/validators.js"></script>
  <script src="assets/auth.js"></script>
  <script src="assets/app.js"></script>
  <script src="assets/bottom-nav.js"></script>
  <script src="assets/game-frame.js"></script>
  <script>
    if (!ZKNAuth.requireLogin('historico.html')) throw new Error('redirecionado');

    let todas = [];
    let apostas = [];
    let apostasCarregadas = false;
    let visao = 'wallet';
    let filtro = 'all';

    const LABELS = { deposit: 'Depósito', withdraw: 'Saque', bonus: 'Bônus' };
    const STATUS_MAP = {
      completed: { cls: 'active', label: 'Concluído' },
      pending: { cls: 'pending', label: 'Pendente' },
      processing: { cls: 'processing', label: 'Processando' },
      expired: { cls: 'expired', label: 'Expirado' },
      rejected: { cls: 'rejected', label: 'Rejeitado' },
    };

    function renderWallet() {
      document.getElementById('filtros').style.display = 'flex';
      document.getElementById('thead').innerHTML = '<tr><th>Tipo</th><th>Data</th><th>Valor</th><th>Status</th></tr>';
      const lista = filtro === 'all' ? todas : todas.filter(t => t.type === filtro);
      const tbody = document.getElementById('tbody');
      if (!lista.length) {
        tbody.innerHTML = '<tr><td colspan="4" style="text-align:center;padding:40px;color:var(--text-muted);">Nenhuma transação encontrada.</td></tr>';
        return;
      }
      tbody.innerHTML = lista.map(t => {
        const positivo = t.type === 'deposit' || t.type === 'win' || t.type === 'bonus';
        const sinal = positivo ? '+' : '-';
        const dt = new Date(t.created_at);
        const st = STATUS_MAP[t.status] || { cls: 'pending', label: t.status || 'Pendente' };
        return `
          <tr>
            <td style="font-weight:700;">${ZKN.escapeHtml(LABELS[t.type] || t.type)}</td>
            <td style="color:var(--text-muted);">${dt.toLocaleDateString('pt-BR')} ${dt.toLocaleTimeString('pt-BR', {hour:'2-digit',minute:'2-digit'})}</td>
            <td style="font-weight:800;color:${positivo ? 'var(--green)' : 'var(--red)'};">${sinal}${ZKN.formatBRL(Math.abs(t.amount))}</td>
            <td><span class="status-pill ${ZKN.escapeHtml(st.cls)}">${ZKN.escapeHtml(st.label)}</span></td>
          </tr>
        `;
      }).join('');
    }

    function renderBets() {
      document.getElementById('filtros').style.display = 'none';
      document.getElementById('thead').innerHTML = '<tr><th>Jogo</th><th>Evento</th><th>Data</th><th>Valor</th><th>Saldo após</th></tr>';
      const tbody = document.getElementById('tbody');
      if (!apostas.length) {
        tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;padding:40px;color:var(--text-muted);">Nenhuma aposta registrada ainda.</td></tr>';
        return;
      }
      tbody.innerHTML = apostas.map(b => {
        const dt = new Date(b.created_at);
        let tipoLabel = 'Aposta';
        let pillCls = 'pending';
        let valorNum = Number(b.bet || 0);
        let sinal = '-';
        let color = 'var(--text)';
        if (b.kind === 'win') {
          tipoLabel = 'Prêmio';
          pillCls = 'active';
          valorNum = Number(b.win || 0);
          sinal = '+';
          color = 'var(--green)';
        } else if (b.kind === 'rollback') {
          tipoLabel = 'Estorno';
          pillCls = 'processing';
          valorNum = Math.abs(Number(b.bet || 0));
          sinal = '+';
          color = 'var(--gold)';
        }
        return `
          <tr>
            <td style="font-weight:700;">${ZKN.escapeHtml(b.game_name || b.game_code || 'Jogo')}</td>
            <td><span class="status-pill ${pillCls}">${tipoLabel}</span></td>
            <td style="color:var(--text-muted);">${dt.toLocaleDateString('pt-BR')} ${dt.toLocaleTimeString('pt-BR', {hour:'2-digit',minute:'2-digit'})}</td>
            <td style="font-weight:800;color:${color};">${sinal}${ZKN.formatBRL(valorNum)}</td>
            <td style="font-weight:700;color:var(--gold);">${ZKN.formatBRL(b.balance_after || 0)}</td>
          </tr>
        `;
      }).join('');
    }

    async function trocarVisao(v, btn) {
      visao = v;
      document.querySelectorAll('#viewTabs button').forEach(x => {
        x.className = x === btn ? 'active' : 'secondary';
      });
      if (visao === 'wallet') {
        renderWallet();
      } else {
        if (!apostasCarregadas) {
          document.getElementById('tbody').innerHTML = '<tr><td colspan="5" style="text-align:center;padding:40px;color:var(--text-muted);">Carregando apostas...</td></tr>';
          apostas = await ZKNAuth.getApostas();
          apostasCarregadas = true;
        }
        renderBets();
      }
    }

    function montarFiltros() {
      const barra = document.getElementById('filtros');
      const tipos = ['all', 'deposit', 'withdraw', 'bonus'];
      barra.innerHTML = '';
      tipos.forEach(t => {
        const b = document.createElement('button');
        b.textContent = t === 'all' ? 'Todos' : LABELS[t];
        b.className = t === 'all' ? 'active' : 'secondary';
        b.onclick = () => {
          filtro = t;
          document.querySelectorAll('#filtros button').forEach(x => {
            x.className = x === b ? 'active' : 'secondary';
          });
          renderWallet();
        };
        barra.appendChild(b);
      });
    }

    async function iniciar() {
      montarFiltros();
      todas = await ZKNAuth.getTransacoes();
      renderWallet();
    }

    iniciar();
  </script>
</body>
</html>
