<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https:; style-src 'self' 'unsafe-inline' https:; img-src 'self' data: blob: https:; font-src 'self' data: https:; connect-src 'self' https: wss:; frame-src 'self' https:; media-src 'self' data: blob: https:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self' https:">
  <title>ZKNbet — Configurar saque</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Sora:wght@800&display=swap" rel="stylesheet">
  <link rel="preconnect" href="https://zknbet-api.gabrielrobin63.workers.dev" crossorigin>
  <link rel="stylesheet" href="assets/style.css">
  <link rel="stylesheet" href="assets/icons.css">
</head>
<body>
  <header class="zkn-header"><div class="zkn-header-inner"></div></header>

  <div class="auth-wrap">
    <div class="card auth-card">
      <h1 id="saqueCfgTitle">Configurar saque</h1>
      <p class="subtitle" id="saqueCfgSubtitle">Antes do primeiro saque, defina sua senha de 6 dígitos e cadastre sua chave PIX.</p>

      <div id="currentPinWrap" style="display:none;">
        <label for="currentPin">PIN de saque atual (6 dígitos)</label>
        <input type="password" id="currentPin" inputmode="numeric" maxlength="6" placeholder="••••••" autocomplete="off">
      </div>

      <label for="pin" id="pinLabel">Senha de saque (6 dígitos)</label>
      <input type="password" id="pin" inputmode="numeric" maxlength="6" placeholder="••••••" autocomplete="off">

      <label for="pin2">Confirmar senha de 6 dígitos</label>
      <input type="password" id="pin2" inputmode="numeric" maxlength="6" placeholder="••••••" autocomplete="off">

      <hr style="border:none;border-top:1px solid var(--border);margin:24px 0;">

      <label for="pixKey">Chave PIX</label>
      <input type="text" id="pixKey" placeholder="CPF, celular, e-mail ou chave aleatória">
      <p class="field-hint" id="pixTypeHint">Digite para detectar automaticamente o tipo.</p>

      <label for="holderName">Nome completo do titular</label>
      <input type="text" id="holderName" placeholder="Como está no banco">

      <label for="holderCpf">CPF do titular</label>
      <input type="text" id="holderCpf" placeholder="000.000.000-00" inputmode="numeric" maxlength="14">

      <button id="btnSalvar" class="btn-primary btn-block">Salvar e continuar</button>
      <p class="auth-alt"><a href="saque.html">← Voltar para saque</a></p>
    </div>
  </div>

  <script src="assets/loading.js"></script>
  <script src="assets/config.js"></script>
  <script src="assets/validators.js"></script>
  <script src="assets/auth.js"></script>
  <script src="assets/app.js"></script>
  <script src="assets/bottom-nav.js"></script>
  <script src="assets/game-frame.js"></script>
  <script>
    if (!ZKNAuth.requireLogin('saque-primeiro-acesso.html')) throw new Error('redirecionado');

    const pixEl = document.getElementById('pixKey');
    const hintEl = document.getElementById('pixTypeHint');
    const cpfEl = document.getElementById('holderCpf');
    const currentPinEl = document.getElementById('currentPin');
    const pinEl = document.getElementById('pin');
    const pin2El = document.getElementById('pin2');
    const jaTemPin = ZKNAuth.temPinSaque();

    [currentPinEl, pinEl, pin2El].forEach(el => {
      if (!el) return;
      el.addEventListener('input', () => { el.value = el.value.replace(/\D/g, '').slice(0, 6); });
    });

    pixEl.addEventListener('input', () => {
      if (pixEl.value.includes('@')) {
        const t = window.ZKNVal.identificarTipo(pixEl.value);
        hintEl.innerHTML = t.tipo === 'email' ? '<span class="ico ico-check"></span> E-mail válido' : '⚠ E-mail inválido';
        hintEl.style.color = t.tipo === 'email' ? 'var(--green)' : 'var(--red)';
        return;
      }
      if (/[a-f0-9]{8}-[a-f0-9]{4}/i.test(pixEl.value)) {
        const valido = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(pixEl.value.trim());
        hintEl.innerHTML = valido ? '<span class="ico ico-check"></span> Chave aleatória válida' : 'Continue digitando a chave aleatória (UUID)';
        hintEl.style.color = valido ? 'var(--green)' : 'var(--text-muted)';
        return;
      }
      window.ZKNVal.mascaraPixDinamica(pixEl);
      const raw = pixEl.value.replace(/\D/g, '');
      if (raw.length === 11) {
        const t = window.ZKNVal.identificarTipo(pixEl.value);
        hintEl.innerHTML = t.tipo === 'cpf'
          ? '<span class="ico ico-check"></span> CPF válido'
          : (t.tipo === 'phone' ? '<span class="ico ico-check"></span> Celular válido' : '⚠ Número inválido');
        hintEl.style.color = t.tipo === 'unknown' ? 'var(--red)' : 'var(--green)';
      } else {
        hintEl.textContent = 'Digite 11 dígitos (CPF ou celular), e-mail ou chave aleatória.';
        hintEl.style.color = 'var(--text-muted)';
      }
    });

    cpfEl.addEventListener('input', () => window.ZKNVal.mascaraCPF(cpfEl));

    if (jaTemPin) {
      document.getElementById('saqueCfgTitle').textContent = 'Alterar dados de saque PIX';
      document.getElementById('saqueCfgSubtitle').textContent = 'Confirme seu PIN atual para atualizar sua chave PIX ou definir um novo PIN.';
      document.getElementById('pinLabel').textContent = 'Novo PIN de saque (6 dígitos)';
      document.getElementById('currentPinWrap').style.display = 'block';
      ZKNAuth.getDadosSaque().then(dados => {
        if (!dados) return;
        if (dados.pixKey) pixEl.value = dados.pixKey;
        if (dados.holderName) document.getElementById('holderName').value = dados.holderName;
        if (dados.holderCpf) {
          cpfEl.value = dados.holderCpf;
          window.ZKNVal.mascaraCPF(cpfEl);
        }
        pixEl.dispatchEvent(new Event('input'));
      }).catch(() => {});
    }

    document.getElementById('btnSalvar').onclick = async () => {
      const currentPin = jaTemPin ? currentPinEl.value : undefined;
      const pin = pinEl.value;
      const pin2 = pin2El.value;
      const pixKeyRaw = pixEl.value.trim();
      const holderNameRaw = document.getElementById('holderName').value.trim();
      const holderName = window.ZKNVal.removerAcentos(holderNameRaw).replace(/[^A-Za-z\s]/g, '').trim();
      const holderCpf = cpfEl.value.replace(/\D/g, '');

      if (jaTemPin && !/^\d{6}$/.test(currentPin || '')) {
        return ZKN.toast('PIN atual obrigatório', 'Informe o seu PIN atual de 6 dígitos.', 'error');
      }
      if (!/^\d{6}$/.test(pin)) return ZKN.toast('PIN inválido', 'Use 6 dígitos numéricos.', 'error');
      if (pin !== pin2) return ZKN.toast('PINs não coincidem', 'Confirme o mesmo PIN.', 'error');

      const id = window.ZKNVal.identificarTipo(pixKeyRaw);
      if (id.tipo === 'unknown') return ZKN.toast('Chave PIX inválida', 'Informe CPF, celular, e-mail ou chave aleatória válida.', 'error');
      if (!holderName || holderName.length < 5) return ZKN.toast('Nome inválido', 'Nome completo do titular (somente letras).', 'error');
      if (!window.ZKNVal.validarCPF(holderCpf)) return ZKN.toast('CPF inválido', 'CPF do titular inválido.', 'error');

      const btn = document.getElementById('btnSalvar');
      btn.disabled = true;
      btn.textContent = 'Salvando...';

      const r = await ZKNAuth.salvarPinSaque({
        pin,
        currentPin,
        pixKey: id.valor,
        pixKeyType: id.tipo,
        holderName,
        holderCpf,
      });

      btn.disabled = false;
      btn.textContent = 'Salvar e continuar';

      if (!r.sucesso) return ZKN.toast('Erro', r.mensagem, 'error');

      ZKN.toast('Configuração salva!', 'Agora você pode sacar.');
      setTimeout(() => location.href = 'saque.html', 800);
    };
  </script>
</body>
</html>
