<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZKNbet — Alterar Senha</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Sora:wght@800&display=swap" rel="stylesheet">
  <link rel="preconnect" href="https://zknbet-api.gabrielrobin63.workers.dev" crossorigin>
  <link rel="preconnect" href="https://nitrogames.pladarck.shop" crossorigin>
  <link rel="dns-prefetch" href="https://nitrogames.pladarck.shop">
  <link rel="stylesheet" href="assets/style.css">
  <link rel="stylesheet" href="assets/icons.css">
</head>
<body>
  <header class="zkn-header"><div class="zkn-header-inner"></div></header>

  <div class="auth-wrap">
    <div class="card auth-card">
      <h1><span class="ico ico-lock"></span> Alterar senha</h1>
      <p class="subtitle">Informe a senha atual e defina uma nova.</p>

      <label for="atual">Senha atual</label>
      <input type="password" id="atual" autocomplete="current-password">

      <label for="nova">Nova senha</label>
      <input type="password" id="nova" placeholder="Mínimo 6 caracteres" autocomplete="new-password">

      <label for="nova2">Confirmar nova senha</label>
      <input type="password" id="nova2" autocomplete="new-password">

      <button id="btnSalvar" class="btn-primary btn-block">Alterar senha</button>
      <p class="auth-alt"><a href="minha-conta.html">← Voltar</a></p>
    </div>
  </div>

  <script src="assets/loading.js"></script>
  <script src="assets/config.js"></script>
  <script src="assets/validators.js"></script>
  <script src="assets/auth.js"></script>
  <script src="assets/app.js"></script>
  <script src="assets/bottom-nav.js"></script>
  <script src="assets/game-frame.js"></script>
  <script>
    if (!ZKNAuth.requireLogin('alterar-senha.html')) throw new Error('redirecionado');

    document.getElementById('btnSalvar').onclick = async () => {
      const atual = document.getElementById('atual').value;
      const nova = document.getElementById('nova').value;
      const nova2 = document.getElementById('nova2').value;

      if (!atual || atual.length < 6) return ZKN.toast('Senha atual inválida', 'Digite sua senha atual.', 'error');
      if (!nova || nova.length < 6) return ZKN.toast('Senha muito curta', 'Mínimo de 6 caracteres.', 'error');
      if (nova !== nova2) return ZKN.toast('Senhas não coincidem', 'Confirme a nova senha.', 'error');
      if (nova === atual) return ZKN.toast('Senha igual', 'A nova senha deve ser diferente da atual.', 'error');

      const btn = document.getElementById('btnSalvar');
      btn.disabled = true;
      btn.textContent = 'Alterando...';

      const r = await ZKNAuth.alterarSenha({ currentPassword: atual, newPassword: nova });
      btn.disabled = false;
      btn.textContent = 'Alterar senha';

      if (!r.sucesso) return ZKN.toast('Erro', r.mensagem, 'error');
      ZKN.toast('Senha alterada!', 'Use a nova senha no próximo login.');
      setTimeout(() => location.href = 'minha-conta.html', 800);
    };
  </script>
<script>
  // Olhinho para mostrar/ocultar senha
  document.addEventListener('DOMContentLoaded', () => {
    document.querySelectorAll('input[type="password"]').forEach(input => {
      // Evita duplicar se já existir
      if (input.parentNode.classList.contains('zkn-pass-wrap')) return;

      // Cria o wrapper e move o input pra dentro
      const wrap = document.createElement('div');
      wrap.className = 'zkn-pass-wrap';
      input.parentNode.insertBefore(wrap, input);
      wrap.appendChild(input);

      // Cria o botão do olho
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'zkn-eye-toggle';
      btn.innerHTML = `
        <svg class="eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
          <line x1="1" y1="1" x2="23" y2="23"></line>
        </svg>
        <svg class="eye-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none;">
          <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
          <circle cx="12" cy="12" r="3"></circle>
        </svg>
      `;
      
      // Adiciona estilo direto no botão pra não depender do CSS
      btn.style.cssText = 'position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--text-muted);cursor:pointer;padding:4px;display:flex;align-items:center;justify-content:center;';
      
      wrap.appendChild(btn);

      btn.onclick = () => {
        const isHidden = input.type === 'password';
        input.type = isHidden ? 'text' : 'password';
        btn.querySelector('.eye-off').style.display = isHidden ? 'none' : 'block';
        btn.querySelector('.eye-on').style.display = isHidden ? 'block' : 'none';
      };

      // Ajusta o padding do input pra não ficar embaixo do olho
      input.style.paddingRight = '40px';
    });
  });
</script>
</body>
</html>
